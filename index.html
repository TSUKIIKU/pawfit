    function uid(prefix = 'id') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
    }

    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
    function round(value, digits = 0) {
      const factor = 10 ** digits;
      return Math.round((Number(value) + Number.EPSILON) * factor) / factor;
    }
    function numberOr(value, fallback = 0) {
      const n = Number(value);
      return Number.isFinite(n) ? n : fallback;
    }
    function formatNum(value, digits = 0) {
      const n = numberOr(value);
      return n.toLocaleString('zh-CN', { maximumFractionDigits: digits, minimumFractionDigits: 0 });
    }
    function formatGrams(value) {
      const n = numberOr(value);
      return Number.isInteger(n) ? String(n) : n.toFixed(1).replace(/\.0$/, '');
    }
    function isTimedHold(id) {
      return ['h_plank', 'h_sideplank', 'g_plank'].includes(id);
    }
    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    }
    function normalizeText(value) {
      return String(value ?? '').toLowerCase().replace(/[\s\u3000（）()\[\]【】,，.。·_\-]/g, '');
    }
    function dateKey(date = new Date()) {
      const d = date instanceof Date ? date : new Date(date);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function todayKey() { return dateKey(new Date()); }
    function parseDateKey(key) {
      const [year, month, day] = String(key).split('-').map(Number);
      return new Date(year, month - 1, day, 12, 0, 0, 0);
    }
    function addDays(key, days) {
      const d = parseDateKey(key);
      d.setDate(d.getDate() + days);
      return dateKey(d);
    }
    function daysDiff(fromKey, toKey) {
      const from = parseDateKey(fromKey);
      const to = parseDateKey(toKey);
      from.setHours(12, 0, 0, 0);
      to.setHours(12, 0, 0, 0);
      return Math.round((to - from) / 86400000);
    }
    function mondayOf(key) {
      const d = parseDateKey(key);
      const shift = (d.getDay() + 6) % 7;
      d.setDate(d.getDate() - shift);
      return dateKey(d);
    }
    function weekDatesOf(key) {
      const start = mondayOf(key);
      return Array.from({ length: 7 }, (_, i) => addDays(start, i));
    }
    function mondayIndex(key) {
      return (parseDateKey(key).getDay() + 6) % 7;
    }
    function formatMonthDay(key) {
      const d = parseDateKey(key);
      return `${d.getMonth() + 1}月${d.getDate()}日`;
    }
    function formatShortDate(key) {
      const d = parseDateKey(key);
      return `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
    }
    function formatFullDate(key) {
      const d = parseDateKey(key);
      return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 · ${WEEKDAYS_FULL[mondayIndex(key)]}`;
    }
    function isToday(key) { return key === todayKey(); }
    function greeting() {
      const h = new Date().getHours();
      if (h < 6) return '夜深了';
      if (h < 11) return '早上好';
      if (h < 14) return '中午好';
      if (h < 18) return '下午好';
      return '晚上好';
    }

    function getAllFoods() {
      const custom = (state.customFoods || []).map(food => ({
        id: food.id,
        name: food.name,
        kcal: numberOr(food.kcal),
        protein: numberOr(food.protein),
        carbs: numberOr(food.carbs),
        fat: numberOr(food.fat),
        category: food.category || '自定义',
        aliases: Array.isArray(food.aliases) ? food.aliases : [],
        serving: numberOr(food.serving, 100) || 100,
        custom: true
      }));
      return [...BASE_FOODS, ...custom];
    }

    function findFood(id) {
      return getAllFoods().find(food => food.id === id) || null;
    }

    function foodNutrition(food, grams) {
      const factor = numberOr(grams) / 100;
      return {
        kcal: round(food.kcal * factor, 0),
        protein: round(food.protein * factor, 1),
        carbs: round(food.carbs * factor, 1),
        fat: round(food.fat * factor, 1)
      };
    }

    function calculateMetrics(profile) {
      if (!profile) return null;
      const weight = clamp(numberOr(profile.weight, 60), 25, 300);
      const height = clamp(numberOr(profile.height, 165), 100, 250);
      const age = clamp(numberOr(profile.age, 28), 10, 100);
      const heightM = height / 100;
      const bmi = weight / (heightM * heightM);
      const bmr = profile.gender === 'male'
        ? 10 * weight + 6.25 * height - 5 * age + 5
        : 10 * weight + 6.25 * height - 5 * age - 161;
      const activity = ACTIVITIES[profile.activity] || ACTIVITIES.light;
      const tdee = bmr * activity.factor;
      const nutrition = GOAL_NUTRITION[profile.goal] || GOAL_NUTRITION['维持健康'];
      const rawTarget = tdee * nutrition.calorie;
      const calorieFloor = profile.gender === 'male' ? 1400 : 1200;
      const targetCalories = Math.max(calorieFloor, Math.round(rawTarget / 10) * 10);
      const protein = Math.round(weight * nutrition.protein);
      const fat = Math.round(weight * nutrition.fat);
      const carbs = Math.max(30, Math.round((targetCalories - protein * 4 - fat * 9) / 4));
      const macroCalories = protein * 4 + carbs * 4 + fat * 9;
      const caloriePct = {
        protein: Math.round((protein * 4 / macroCalories) * 100),
        carbs: Math.round((carbs * 4 / macroCalories) * 100),
        fat: Math.round((fat * 9 / macroCalories) * 100)
      };
      let bmiLabel = '正常';
      if (bmi < 18.5) bmiLabel = '偏轻';
      else if (bmi >= 28) bmiLabel = '肥胖';
      else if (bmi >= 24) bmiLabel = '超重';
      return {
        bmi: round(bmi, 1),
        bmiLabel,
        bmr: Math.round(bmr),
        tdee: Math.round(tdee),
        targetCalories,
        protein,
        carbs,
        fat,
        macroCalories,
        caloriePct,
        waterTarget: Math.max(1500, Math.round(weight * 35 / 100) * 100),
        activityLabel: activity.label,
        goalTone: nutrition.tone
      };
    }

    function getPlanContext(date = todayKey()) {
      const profile = state.profile;
      if (!profile) return null;
      const start = state.planStart || todayKey();
      const elapsed = Math.max(0, daysDiff(start, date));
      const phase = Math.floor(elapsed / 28) + 1;
      const phaseDay = (elapsed % 28) + 1;
      const weekInPhase = Math.floor((elapsed % 28) / 7);
      const templateId = GOAL_TEMPLATE_MAP[profile.goal] || 'shape';
      const template = PLAN_TEMPLATES[templateId];
      const weekProfile = template.weeks[weekInPhase];
      const activeDays = ACTIVE_DAY_MAP[clamp(numberOr(profile.days, 4), 3, 6)] || ACTIVE_DAY_MAP[4];
      const mondayPos = mondayIndex(date);
      const activePosition = activeDays.indexOf(mondayPos);
      const isRest = activePosition === -1;
      const adaptation = getAdaptationForDate(date);
      const phaseScale = 1 + (phase - 1) * 0.05;
      const volumeFactor = { '减脂': 1, '增肌': 1.08, '塑形': 1, '维持健康': .9, '康复': .72 }[profile.goal] || 1;
      const intensity = clamp(Math.round(weekProfile.intensity + (GOAL_TRAINING_OFFSET[profile.goal] || 0) + (phase - 1) * 3 + adaptation.delta * 80), 35, 96);

      if (isRest) {
        return {
          date, start, elapsed, phase, phaseName: PHASE_NAMES[(phase - 1) % PHASE_NAMES.length], phaseDay,
          weekInPhase, phaseWeek: weekInPhase + 1, absoluteWeek: Math.floor(elapsed / 7) + 1,
          template, weekProfile, isRest: true, scene: profile.scene, adaptation, intensity,
          title: '恢复与休息', focus: '散步 · 拉伸 · 充足睡眠', type: '恢复',
          warmup: [], main: [], cooldown: [], duration: 20, calories: Math.round(2.2 * profile.weight * 0.33),
          activeDays, phaseProgress: Math.round((phaseDay / 28) * 100)
        };
      }

      const sessionKey = weekProfile.sessions[activePosition % weekProfile.sessions.length];
      let blueprint = SESSION_BLUEPRINTS[sessionKey] || SESSION_BLUEPRINTS.fullA;
      let scene = profile.scene === 'hybrid' ? (activePosition % 2 === 0 ? 'home' : 'gym') : profile.scene;
      if (scene !== 'home' && scene !== 'gym') scene = 'home';
      if (profile.goal === '康复') {
        blueprint = {
          ...blueprint,
          home: blueprint.home.map(id => LOW_IMPACT_SWAP[id] || id),
          gym: blueprint.gym.map(id => LOW_IMPACT_SWAP[id] || id),
          title: blueprint.title.includes('恢复') ? blueprint.title : blueprint.title + ' · 低冲击',
          tip: '康复阶段以无痛、可控为前提，任何不适应立即停止。'
        };
      }

      const adjustSets = 1 + adaptation.delta;
      const prescribe = (id, section = 'main') => {
        const ex = EXERCISES[id];
        if (!ex) return null;
        let sets = ex.sets || 1;
        let reps = 0;
        let minutes = 0;
        let seconds = 0;
        if (section === 'warmup') {
          sets = 1;
          seconds = ex.type === 'strength' ? 0 : Math.max(20, ex.minutes || 30);
          if (ex.type === 'cardio' && ex.minutes) {
            minutes = ex.minutes;
            seconds = 0;
          }
        } else if (section === 'cooldown') {
          sets = 1;
          seconds = ex.minutes || 30;
        } else if (ex.type === 'strength') {
          const baseSets = Math.round(weekProfile.sets * volumeFactor * phaseScale * adjustSets);
          sets = clamp(baseSets, 2, 6);
          if (isTimedHold(id)) {
            seconds = clamp(Math.round((ex.minutes || 30) * phaseScale), 20, 120);
          } else {
            const baseReps = Math.round(weekProfile.reps * phaseScale * (1 + Math.max(-.1, adaptation.delta)));
            reps = clamp(baseReps, 6, 30);
          }
        } else if (ex.type === 'cardio') {
          if (id.startsWith('h_')) {
            sets = clamp(Math.round((weekProfile.sets + 1) * adjustSets), 2, 6);
            seconds = clamp(Math.round((ex.minutes || 35) * phaseScale), 20, 90);
          } else {
            sets = 1;
            minutes = clamp(Math.round((ex.minutes || 15) * phaseScale * (1 + adaptation.delta * .5)), 6, 60);
          }
        } else {
          sets = 1;
          seconds = Math.round((ex.minutes || 30) * (1 + Math.max(0, adaptation.delta)));
        }
        return { ex, sets, reps, minutes, seconds, section };
      };

      const warmupIds = scene === 'gym' && blueprint.warmup.includes('w_bike')
        ? blueprint.warmup
        : blueprint.warmup.filter(id => !(scene === 'home' && EXERCISES[id]?.mode === 'gym'));
      const main = blueprint[scene].map(id => prescribe(id, 'main')).filter(Boolean);
      const warmup = warmupIds.map(id => prescribe(id, 'warmup')).filter(Boolean);
      const cooldown = blueprint.cooldown.map(id => prescribe(id, 'cooldown')).filter(Boolean);
      const plannedDuration = Math.max(15, Math.round(blueprint.duration * phaseScale * (1 + Math.max(-.1, adaptation.delta) * .5)));
      const met = blueprint.met || 5;
      const calories = Math.round(met * 3.5 * numberOr(profile.weight) / 200 * plannedDuration);

      return {
        date, start, elapsed, phase, phaseName: PHASE_NAMES[(phase - 1) % PHASE_NAMES.length], phaseDay,
        weekInPhase, phaseWeek: weekInPhase + 1, absoluteWeek: Math.floor(elapsed / 7) + 1,
        template, weekProfile, isRest: false, scene,
        title: blueprint.title, focus: blueprint.focus, type: blueprint.type, tip: blueprint.tip,
        warmup, main, cooldown, duration: plannedDuration, calories, intensity, adaptation,
        activeDays, phaseProgress: Math.round((phaseDay / 28) * 100), sessionKey,
        plannedSets: main.reduce((sum, item) => sum + (item.ex.type === 'strength' ? item.sets : 0), 0)
      };
    }

    function getTrainingLoad(checkin) {
      let tonnage = 0;
      let weightedSets = 0;
      Object.values(checkin?.exerciseLogs || {}).forEach(log => {
        const sets = Math.max(0, numberOr(log.sets, 0));
        const reps = Math.max(0, numberOr(log.reps, 0));
        const seconds = Math.max(0, numberOr(log.seconds, 0));
        const weight = Math.max(0, numberOr(log.weight, 0));
        if (!sets || !weight) return;
        const workPerSet = reps || (seconds ? seconds / 15 : 1);
        tonnage += sets * workPerSet * weight;
        weightedSets += sets;
      });
      return { tonnage: Math.round(tonnage), weightedSets };
    }

    function getRecentLoadBaseline(beforeDate) {
      const loads = Object.keys(state.checkins || {})
        .filter(key => key < beforeDate)
        .sort()
        .slice(-3)
        .map(key => getTrainingLoad(state.checkins[key]))
        .filter(load => load.tonnage > 0);
      if (!loads.length) return 0;
      return loads.reduce((sum, load) => sum + load.tonnage, 0) / loads.length;
    }

    function getAdaptationForDate(date) {
      const previous = addDays(date, -1);
      const checkin = state.checkins[previous];
      if (!checkin) return { delta: 0, label: '', tone: 'neutral' };
      const completion = numberOr(checkin.completion, 0);
      const duration = numberOr(checkin.duration, 0);
      const planned = numberOr(checkin.plannedDuration, 0);
      const rpe = clamp(numberOr(checkin.rpe, 7), 1, 10);
      const durationGood = !planned || duration >= planned * .85;
      const durationLow = Boolean(planned && duration < planned * .6);
      const load = getTrainingLoad(checkin);
      const baseline = getRecentLoadBaseline(previous);
      const loadRatio = baseline > 0 && load.tonnage > 0 ? load.tonnage / baseline : null;
      const highQuality = completion >= .9 && durationGood && rpe <= 8;
      const lowQuality = completion < .6 || durationLow || rpe >= 9;

      if (lowQuality) {
        const reason = rpe >= 9 ? `主观强度 RPE ${rpe} 偏高` : '完成度或时长偏低';
        return { delta: -.10, label: `昨天${reason}：今日容量 -10%，优先恢复、睡眠与动作质量。`, tone: 'down' };
      }
      if (highQuality && loadRatio !== null && loadRatio < .85) {
        return { delta: 0, label: '昨天完成度不错，但训练负重较近期下降：今日维持原容量，先巩固动作质量。', tone: 'neutral' };
      }
      if (highQuality) {
        const loadText = loadRatio !== null && loadRatio >= 1.05 ? '负重较近期提升' : loadRatio !== null ? '负重与时长稳定' : '时长充足';
        return { delta: .05, label: `昨天完成度高、${loadText}：今日训练容量 +5%，继续保持动作质量。`, tone: 'up' };
      }
      if (loadRatio !== null && loadRatio >= 1.05 && completion >= .75 && rpe <= 8) {
        return { delta: 0, label: '昨天负重有提升、完成度稳定：今日按原计划推进，避免额外加量。', tone: 'neutral' };
      }
      return { delta: 0, label: '昨天完成度与负重稳定：今日按原计划推进。', tone: 'neutral' };
    }

    function getDayLog(date) {
      if (!state.logs[date]) state.logs[date] = { entries: [], water: 0 };
      if (!Array.isArray(state.logs[date].entries)) state.logs[date].entries = [];
      state.logs[date].water = numberOr(state.logs[date].water, 0);
      return state.logs[date];
    }

    function getNutritionTotals(date) {
      const entries = state.logs[date]?.entries || [];
      return entries.reduce((total, entry) => {
        total.kcal += numberOr(entry.kcal);
        total.protein += numberOr(entry.protein);
        total.carbs += numberOr(entry.carbs);
        total.fat += numberOr(entry.fat);
        return total;
      }, { kcal: 0, protein: 0, carbs: 0, fat: 0 });
    }

    function getWater(date) {
      return numberOr(state.logs[date]?.water, 0);
    }

    function getWorkoutCount() {
      return Object.keys(state.checkins || {}).length;
    }

    function getCurrentStreak() {
      const dates = state.checkins || {};
      let cursor = todayKey();
      if (!dates[cursor]) cursor = addDays(cursor, -1);
      let streak = 0;
      while (dates[cursor]) {
        streak += 1;
        cursor = addDays(cursor, -1);
      }
      return streak;
    }

    function getMaxStreak() {
      const keys = Object.keys(state.checkins || {}).sort();
      let best = 0;
      let current = 0;
      let previous = null;
      keys.forEach(key => {
        if (previous && daysDiff(previous, key) === 1) current += 1;
        else current = 1;
        best = Math.max(best, current);
        previous = key;
      });
      return best;
    }

    function getWeeklyWorkoutCount() {
      const week = weekDatesOf(todayKey());
      return week.filter(key => Boolean(state.checkins[key])).length;
    }

    function getTargetMealCalories() {
      const metrics = calculateMetrics(state.profile);
      if (!metrics) return 0;
      return metrics.targetCalories;
    }

    function getRecommendedMeals(date) {
      const metrics = calculateMetrics(state.profile);
      if (!metrics) return [];
      const split = { breakfast: .28, lunch: .40, dinner: .32 };
      const offset = numberOr(state.recipeOffset[date], 0);
      const dayIndex = Math.floor(parseDateKey(date).getTime() / 86400000);
      return ['breakfast', 'lunch', 'dinner'].map((mealType, mealIndex) => {
        const options = RECIPE_LIBRARY[mealType];
        const recipe = options[Math.abs(dayIndex + offset + mealIndex * 2) % options.length];
        const baseIngredients = recipe.ingredients.map(([name, grams]) => {
          const food = FOOD_BY_NAME[name];
          const nutrition = food ? foodNutrition(food, grams) : { kcal: 0, protein: 0, carbs: 0, fat: 0 };
          return { name, grams, food, nutrition };
        });
        const baseKcal = baseIngredients.reduce((sum, item) => sum + item.nutrition.kcal, 0) || 1;
        const targetKcal = metrics.targetCalories * split[mealType];
        const scale = clamp(targetKcal / baseKcal, .62, 1.8);
        const ingredients = baseIngredients.map(item => {
          const grams = item.grams > 20 ? Math.round(item.grams * scale / 5) * 5 : Math.max(1, Math.round(item.grams * scale));
          const nutrition = item.food ? foodNutrition(item.food, grams) : item.nutrition;
          return { ...item, grams, nutrition };
        });
        const totals = ingredients.reduce((sum, item) => {
          sum.kcal += item.nutrition.kcal;
          sum.protein += item.nutrition.protein;
          sum.carbs += item.nutrition.carbs;
          sum.fat += item.nutrition.fat;
          return sum;
        }, { kcal: 0, protein: 0, carbs: 0, fat: 0 });
        return {
          ...recipe, mealType, ingredients, scale,
          kcal: Math.round(totals.kcal), protein: round(totals.protein, 1),
          carbs: round(totals.carbs, 1), fat: round(totals.fat, 1)
        };
      });
    }

    function getNutritionAdherenceDays() {
      const metrics = calculateMetrics(state.profile);
      if (!metrics) return 0;
      let cursor = todayKey();
      const todayTotal = getNutritionTotals(cursor).kcal;
      if (todayTotal <= 0) cursor = addDays(cursor, -1);
      let days = 0;
      for (let i = 0; i < 90; i += 1) {
        const total = getNutritionTotals(cursor).kcal;
        if (total >= metrics.targetCalories * .8 && total <= metrics.targetCalories * 1.15) {
          days += 1;
          cursor = addDays(cursor, -1);
        } else break;
      }
      return days;
    }

    function getWaterAdherenceDays() {
      const metrics = calculateMetrics(state.profile);
      if (!metrics) return 0;
      let cursor = todayKey();
      if (getWater(cursor) < metrics.waterTarget) cursor = addDays(cursor, -1);
      let days = 0;
      for (let i = 0; i < 90; i += 1) {
        if (getWater(cursor) >= metrics.waterTarget) {
          days += 1;
          cursor = addDays(cursor, -1);
        } else break;
      }
      return days;
    }

    function getTransformation() {
      const measurements = [...(state.measurements || [])].filter(item => item.weight || item.bodyfat).sort((a, b) => a.date.localeCompare(b.date));
      if (measurements.length < 2) return { unlocked: false, weightDelta: 0, bodyfatDelta: 0 };
      const first = measurements[0];
      const last = measurements[measurements.length - 1];
      const weightDelta = last.weight && first.weight ? numberOr(last.weight) - numberOr(first.weight) : 0;
      const bodyfatDelta = last.bodyfat && first.bodyfat ? numberOr(last.bodyfat) - numberOr(first.bodyfat) : 0;
      return { unlocked: Math.abs(weightDelta) >= 2 || Math.abs(bodyfatDelta) >= 2, weightDelta: round(weightDelta, 1), bodyfatDelta: round(bodyfatDelta, 1) };
    }

    function getAchievementProgress(achievement) {
      const current = state.achievements[achievement.id];
      if (current) return '已解锁';
      switch (achievement.id) {
        case 'first': return `${Math.min(getWorkoutCount(), 1)}/1 次训练`;
        case 'streak7': return `${Math.min(Math.max(getMaxStreak(), getCurrentStreak()), 7)}/7 天`;
        case 'workouts10': return `${Math.min(getWorkoutCount(), 10)}/10 次`;
        case 'water7': return `${Math.min(getWaterAdherenceDays(), 7)}/7 天`;
        case 'nutrition7': return `${Math.min(getNutritionAdherenceDays(), 7)}/7 天`;
        case 'phase1': {
          const days = state.planStart ? Math.max(0, daysDiff(state.planStart, todayKey())) : 0;
          return `${Math.min(days + 1, 28)}/28 天 · ${Math.min(getWorkoutCount(), 12)}/12 次`;
        }
        case 'measure5': return `${Math.min(state.measurements.length, 5)}/5 次`;
        case 'transform': {
          const change = getTransformation();
          return change.unlocked ? '已达标' : '还需变化 2 点';
        }
        case 'allround': {
          const unlocked = ACHIEVEMENTS.filter(a => a.id !== 'allround' && state.achievements[a.id]).length;
          return `${unlocked}/8 枚`;
        }
        default: return '';
      }
    }

    function evaluateAchievements() {
      const metrics = calculateMetrics(state.profile);
      const newlyUnlocked = [];
      const conditions = {
        first: getWorkoutCount() >= 1,
        streak7: Math.max(getMaxStreak(), getCurrentStreak()) >= 7,
        workouts10: getWorkoutCount() >= 10,
        water7: getWaterAdherenceDays() >= 7,
        nutrition7: getNutritionAdherenceDays() >= 7,
        phase1: Boolean(metrics && state.planStart && daysDiff(state.planStart, todayKey()) >= 28 && getWorkoutCount() >= 12),
        measure5: state.measurements.length >= 5,
        transform: getTransformation().unlocked
      };
      ACHIEVEMENTS.forEach(achievement => {
        if (achievement.id === 'allround' || state.achievements[achievement.id]) return;
        if (conditions[achievement.id]) {
          state.achievements[achievement.id] = { unlockedAt: new Date().toISOString() };
          newlyUnlocked.push(achievement);
        }
      });
      const baseIds = ACHIEVEMENTS.filter(a => a.id !== 'allround').map(a => a.id);
      if (!state.achievements.allround && baseIds.every(id => state.achievements[id])) {
        state.achievements.allround = { unlockedAt: new Date().toISOString() };
        newlyUnlocked.push(ACHIEVEMENTS.find(a => a.id === 'allround'));
      }
      if (newlyUnlocked.length) saveState();
      return newlyUnlocked;
    }

    // ---------- Native canvas charts ----------
    function prepareCanvas(canvas) {
      if (!canvas) return null;
      const rect = canvas.getBoundingClientRect();
      const width = Math.max(1, rect.width || canvas.parentElement?.clientWidth || 200);
      const height = Math.max(1, rect.height || 160);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, width, height };
    }

    function drawMacroPie(canvas, totals) {
      const prepared = prepareCanvas(canvas);
      if (!prepared) return;
      const { ctx, width, height } = prepared;
      const cx = width / 2;
      const cy = height / 2;
      const radius = Math.min(width, height) / 2 - 4;
      const macroCalories = [totals.protein * 4, totals.carbs * 4, totals.fat * 9];
      const total = macroCalories.reduce((sum, value) => sum + value, 0);
      const colors = ['#C36F8B', '#6F8FAF', '#C79A5B'];
      ctx.clearRect(0, 0, width, height);
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fillStyle = '#EDF1F4';
      ctx.fill();
      if (total > 0) {
        let angle = -Math.PI / 2;
        macroCalories.forEach((value, index) => {
          const slice = (value / total) * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, radius, angle, angle + slice);
          ctx.closePath();
          ctx.fillStyle = colors[index];
          ctx.fill();
          angle += slice;
        });
      }
      ctx.beginPath();
      ctx.arc(cx, cy, radius * .64, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
    }

    function drawTrendChart(canvas, measurements, metric, period) {
      const prepared = prepareCanvas(canvas);
      if (!prepared) return;
      const { ctx, width, height } = prepared;
      ctx.clearRect(0, 0, width, height);
      const cutoff = addDays(todayKey(), -period + 1);
      const relevant = [...measurements]
        .filter(item => item[metric] !== '' && item[metric] !== null && item[metric] !== undefined && item.date >= cutoff)
        .sort((a, b) => a.date.localeCompare(b.date));
      const padding = { left: 38, right: 16, top: 18, bottom: 28 };
      const chartW = width - padding.left - padding.right;
      const chartH = height - padding.top - padding.bottom;
      ctx.font = '10px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillStyle = '#9AA4B0';
      ctx.strokeStyle = '#EDF1F4';
      ctx.lineWidth = 1;
      if (!relevant.length) {
        ctx.textAlign = 'center';
        ctx.font = '11px "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.fillText(metric === 'weight' ? '记录体重后，这里会出现趋势曲线' : '记录体脂率后，这里会出现趋势曲线', width / 2, height / 2);
        return;
      }
      const values = relevant.map(item => Number(item[metric]));
      let min = Math.min(...values);
      let max = Math.max(...values);
      const range = max - min || Math.max(1, max * .06);
      min -= range * .2;
      max += range * .2;
      for (let i = 0; i < 4; i += 1) {
        const y = padding.top + chartH * i / 3;
        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(width - padding.right, y);
        ctx.stroke();
        const val = max - (max - min) * i / 3;
        ctx.textAlign = 'right';
        ctx.fillStyle = '#9AA4B0';
        ctx.fillText(val.toFixed(metric === 'bodyfat' ? 1 : 1), padding.left - 7, y + 3);
      }
      const xFor = index => relevant.length === 1 ? padding.left + chartW / 2 : padding.left + chartW * index / (relevant.length - 1);
      const yFor = value => padding.top + chartH * (1 - (value - min) / (max - min));
      const points = relevant.map((item, index) => ({ x: xFor(index), y: yFor(Number(item[metric])), value: Number(item[metric]), date: item.date }));
      const gradient = ctx.createLinearGradient(0, padding.top, 0, height - padding.bottom);
      gradient.addColorStop(0, metric === 'weight' ? 'rgba(195,111,139,.22)' : 'rgba(111,143,175,.22)');
      gradient.addColorStop(1, 'rgba(195,111,139,0)');
      ctx.beginPath();
      points.forEach((point, index) => index === 0 ? ctx.moveTo(point.x, point.y) : ctx.lineTo(point.x, point.y));
      if (points.length > 1) {
        ctx.lineTo(points[points.length - 1].x, height - padding.bottom);
        ctx.lineTo(points[0].x, height - padding.bottom);
        ctx.closePath();
        ctx.fillStyle = gradient;
        ctx.fill();
      }
      ctx.beginPath();
      points.forEach((point, index) => index === 0 ? ctx.moveTo(point.x, point.y) : ctx.lineTo(point.x, point.y));
      ctx.strokeStyle = metric === 'weight' ? '#C36F8B' : '#6F8FAF';
      ctx.lineWidth = 2.4;
      ctx.lineJoin = 'round';
      ctx.stroke();
      points.forEach((point, index) => {
        ctx.beginPath();
        ctx.arc(point.x, point.y, index === points.length - 1 ? 4.5 : 2.8, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.strokeStyle = metric === 'weight' ? '#C36F8B' : '#6F8FAF';
        ctx.lineWidth = 2;
        ctx.stroke();
      });
      const labels = relevant.length <= 3 ? relevant : [relevant[0], relevant[Math.floor((relevant.length - 1) / 2)], relevant[relevant.length - 1]];
      ctx.fillStyle = '#9AA4B0';
      ctx.font = '9px "PingFang SC", "Microsoft YaHei", sans-serif';
      labels.forEach((item) => {
        const index = relevant.indexOf(item);
        ctx.textAlign = index === 0 ? 'left' : index === relevant.length - 1 ? 'right' : 'center';
        ctx.fillText(formatShortDate(item.date), xFor(index), height - 8);
      });
    }

              <div class="achievement-mini-grid">${achievementPreview.map(a => `<button class="achievement-mini ${state.achievements[a.id] ? '' : 'locked'}" data-action="open-achievement" data-id="${a.id}">${medalSVG(a)}<span>${escapeHTML(a.name)}</span></button>`).join('')}</div>
            </section>

            <section class="card">
              <div class="card-head"><div><div class="eyebrow">COACH NOTE</div><h2>今日小提醒</h2></div><span class="pill rose">喵教练</span></div>
              <p style="margin:0;color:#526072;font-size:12px;line-height:1.65">${escapeHTML(metrics.goalTone)} 训练后记得补充蛋白质和水分；睡眠不足时，主动降低一组训练量也是聪明的选择。</p>
            </section>
          </aside>
        </div>
      </div>`;
    }

    function waterGlassSVG(progress) {
      const p = clamp(progress, 0, 1);
      return `<svg viewBox="0 0 72 100" role="img" aria-label="饮水进度插画"><defs><linearGradient id="waterFill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#83B4CD"/><stop offset="1" stop-color="#5B8EAB"/></linearGradient><clipPath id="glassClip"><path d="M15 23h42l-5 62c-.3 4-3 7-7 7H27c-4 0-6.7-3-7-7l-5-62Z"/></clipPath></defs><path d="M26 15c4 5 16 5 20 0" fill="none" stroke="#9AA4B0" stroke-width="2" stroke-linecap="round"/><path d="M12 21h48" stroke="#E5B8C4" stroke-width="4" stroke-linecap="round"/><path d="M15 23h42l-5 62c-.3 4-3 7-7 7H27c-4 0-6.7-3-7-7l-5-62Z" fill="#F8FBFD" stroke="#CFDDE5" stroke-width="1.5"/><g clip-path="url(#glassClip)"><rect x="10" y="${88 - 61 * p}" width="52" height="${61 * p}" fill="url(#waterFill)"/><path d="M10 ${88 - 61 * p}q8-5 16 0t16 0 16 0 10 0" fill="none" stroke="#BCE0EF" stroke-width="2" opacity=".8"/></g><path d="M23 30h8" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".8"/></svg>`;
    }

    function renderTrainingPage() {
      const date = ui.trainingDate;
      const plan = getPlanContext(date);
      const checkin = state.checkins[date];
      const weekDates = weekDatesOf(date);
      const weekDone = weekDates.filter(key => state.checkins[key]).length;
      return `<div class="page-stack">
        <section class="card stage-card">
          <div class="stage-top">
            <div><div class="eyebrow">PHASE ${plan.phase} · WEEK ${plan.phaseWeek}</div><h1>${escapeHTML(plan.template.name)}</h1><p>${escapeHTML(plan.weekProfile.theme)} · ${escapeHTML(plan.weekProfile.note)}</p></div>
            <span class="pill" style="background:rgba(255,255,255,.1);color:#fff">${escapeHTML(plan.phaseName)}</span>
          </div>
          <div class="stage-progress"><div class="progress-track"><div class="progress-fill" style="width:${plan.phaseProgress}%"></div></div><div class="stage-progress-labels"><span>第 ${plan.phaseDay} / 28 天</span><span>阶段完成 ${plan.phaseProgress}%</span></div></div>
        </section>

        <section class="card">
          <div class="card-head" style="margin-bottom:11px"><div><h2>本周训练</h2><p>${formatMonthDay(weekDates[0])} – ${formatMonthDay(weekDates[6])} · 本周完成 ${weekDone} 次</p></div><div class="row"><button class="icon-btn small" data-action="training-week-prev" aria-label="上一周">${icon('left', 15)}</button><button class="btn btn-ghost btn-sm" data-action="training-today">今天</button><button class="icon-btn small" data-action="training-week-next" aria-label="下一周">${icon('right', 15)}</button></div></div>
          ${weekStripHTML(date)}
        </section>

        <div class="training-layout">
          <div class="main-stack">
            ${plan.isRest ? `<section class="card rest-card">
              <div class="rest-art">${catMascotSVG('', true)}</div>
              <h2>今天是恢复日</h2>
              <p>${escapeHTML(date === todayKey() ? '不训练也是计划的一部分。散步、拉伸、睡个好觉，都是在为下一次训练积蓄力量。' : '这一天安排为休息日。可以散步 20 分钟，或做一次舒缓拉伸。')}</p>
              <div class="row" style="justify-content:center;margin-top:16px"><button class="btn btn-secondary" data-action="open-library">${icon('book', 14)} 动作库</button><button class="btn btn-primary" data-action="switch-tab" data-tab="diet">记录饮食</button></div>
            </section>` : `<section class="card">
              <div class="card-head"><div><div class="session-badge"><span class="live-dot"></span>${escapeHTML(plan.type)} · ${escapeHTML(SCENES[plan.scene].label)}</div><h2 style="margin-top:7px">${escapeHTML(plan.title)}</h2><p>${escapeHTML(plan.focus)}</p></div><span class="pill ${checkin ? 'green' : 'rose'}">${checkin ? '已完成' : '待训练'}</span></div>
              <div class="session-meta" style="margin-bottom:14px"><span>${icon('clock', 13)} 预计 ${plan.duration} 分钟</span><span>${icon('flame', 13)} 约 ${plan.calories} kcal</span><span>${icon('bolt', 13)} 强度 ${plan.intensity}%</span><span>${icon('target', 13)} ${plan.phaseWeek}/4 周</span></div>
              ${adaptationBannerHTML(plan) ? `<div style="margin-bottom:14px">${adaptationBannerHTML(plan)}</div>` : ''}
              <div class="stack" style="gap:18px">
                ${flowSectionHTML('01', '热身', '激活关节，升高体温', plan.warmup)}
                ${flowSectionHTML('02', '主训', `${plan.main.length} 个动作 · 控制呼吸与节奏`, plan.main)}
                ${flowSectionHTML('03', '拉伸', '放松目标肌群，收好今天的训练', plan.cooldown)}
              </div>
              <div class="modal-tip" style="margin-top:16px">${icon('info', 14)} ${escapeHTML(plan.tip)}</div>
              ${checkin ? `<div class="completed-panel" style="margin-top:14px"><div class="row"><span class="check-bubble">${icon('check', 16)}</span><div><strong>已记录 ${checkin.duration} 分钟训练</strong><p>完成度 ${Math.round(checkin.completion * 100)}%${checkin.weight ? ` · 训练负重 ${checkin.weight} kg` : ''} · 约 ${checkin.calories} kcal</p></div></div></div>` : ''}
              <div class="workout-actions"><button class="btn btn-primary" data-action="open-checkin">${checkin ? '更新训练打卡' : '完成训练并打卡'}</button><button class="btn btn-secondary" data-action="open-library">动作库</button></div>
            </section>`}
          </div>

          <aside class="side-stack">
            <section class="card">
              <div class="card-head"><div><div class="eyebrow">YOUR PACE</div><h2>训练统计</h2><p>稳定累积，拒绝暴冲</p></div></div>
              <div class="stats-grid">
                <div class="stat-tile dark"><div class="stat-label">${icon('flame', 13)} 连续</div><div class="stat-value">${getCurrentStreak()}<small>天</small></div></div>
                <div class="stat-tile rose"><div class="stat-label">${icon('dumbbell', 13)} 本周</div><div class="stat-value">${getWeeklyWorkoutCount()}<small>次</small></div></div>
                <div class="stat-tile"><div class="stat-label">${icon('check', 13)} 累计</div><div class="stat-value">${getWorkoutCount()}<small>次</small></div></div>
                <div class="stat-tile green"><div class="stat-label">${icon('trophy', 13)} 阶段</div><div class="stat-value">${plan.phase}<small>阶段</small></div></div>
              </div>
            </section>

            <section class="card accent-border">
              <div class="card-head"><div><div class="eyebrow">ADAPTIVE COACH</div><h2>明日自动调节</h2><p>根据今天的完成度调整明天</p></div>${icon('spark', 20)}</div>
              ${adaptationBannerHTML({ adaptation: { delta: plan.adaptation.delta, label: plan.adaptation.delta ? plan.adaptation.label : '完成今天的训练后，系统会根据完成度、时长与负重调整下一天。' } }) || '<p class="small muted" style="margin:0">完成今天的训练后，系统会根据完成度、时长与负重调整下一天。</p>'}
              <div style="margin-top:13px;display:flex;gap:7px;flex-wrap:wrap"><span class="tag">完成度高 +5%</span><span class="tag">完成度低 -10%</span><span class="tag">自动递进</span></div>
            </section>

            <section class="card">
              <div class="card-head"><div><div class="eyebrow">PHASE MAP</div><h2>阶段路线</h2><p>每 4 周自动进入下一阶段</p></div></div>
              <div class="stack-sm">
                ${[1,2,3,4].map(num => `<div class="row" style="padding:8px 9px;border-radius:10px;background:${num === plan.phase ? 'var(--rose-mist)' : '#F8FAFB'}"><span class="flow-index" style="background:${num <= plan.phase ? 'var(--rose)' : '#DDE3E9'}">${num}</span><div style="flex:1"><strong style="font-size:10.5px">${PHASE_NAMES[(num - 1) % 4]}</strong><div class="tiny muted">${num <= plan.phase ? '已到达 / 当前阶段' : '待解锁'}</div></div><span class="tiny ${num === plan.phase ? '' : 'muted'}">${num === plan.phase ? `${plan.phaseProgress}%` : '4 周'}</span></div>`).join('')}
              </div>
            </section>

            <section class="card">
              <div class="row-between" style="margin-bottom:10px"><div><div class="eyebrow">MOVEMENT LIBRARY</div><h2 style="margin:3px 0 0;font-size:16px">动作库</h2></div><span class="pill">${RAW_EXERCISES.length} 个动作</span></div>
              <p class="small muted" style="margin:0 0 12px">徒手力量、有氧、拉伸，居家与健身房版本随时可查。</p>
              <button class="btn btn-secondary btn-wide" data-action="open-library">${icon('book', 15)} 浏览全部动作</button>
            </section>
          </aside>
        </div>
      </div>`;
    }

    function recordEntryHTML(entry) {
      const meal = MEAL_TYPES[entry.mealType] || MEAL_TYPES.snack;
      const iconClass = entry.mealType === 'lunch' ? 'blue' : entry.mealType === 'dinner' ? 'gold' : '';
      return `<div class="record-item">
        <span class="record-icon ${iconClass}">${meal.icon}</span>
        <span class="record-main"><strong>${escapeHTML(entry.name)}</strong><span>${meal.label} · ${formatGrams(entry.grams)}g · 蛋白 ${formatNum(entry.protein, 1)}g</span></span>
        <span class="record-nutrition"><strong>${formatNum(entry.kcal)}</strong><span>kcal</span></span>
        <button class="remove-btn" data-action="remove-entry" data-id="${entry.id}" aria-label="删除 ${escapeHTML(entry.name)}">${icon('trash', 14)}</button>
      </div>`;
    }

    function recordWaterRowHTML(date, compact = false) {
      const metrics = calculateMetrics(state.profile);
      const water = getWater(date);
      return `<div class="water-log-row"><div><div class="water-count">${formatNum(water)} <span class="small muted">ml</span></div><div class="tiny muted">目标 ${formatNum(metrics.waterTarget)} ml · ${water >= metrics.waterTarget ? '今天已达标' : `还差 ${formatNum(metrics.waterTarget - water)} ml`}</div></div><div class="row"><button class="icon-btn small" data-action="remove-water" aria-label="撤回一杯水">−</button><button class="btn btn-primary btn-sm" data-action="add-water">${icon('plus', 12)} 一杯</button></div></div>`;
    }

    function emptyRecordHTML(message = '还没有饮食记录') {
      return `<div class="empty-state"><div class="empty-art">${catMascotSVG('', true)}</div><strong>${escapeHTML(message)}</strong><p>从食物库挑选食材，或直接记下推荐食谱。每一笔都会即时更新营养统计。</p></div>`;
    }

    function renderDietPage() {
      const date = ui.dietDate;
      const metrics = calculateMetrics(state.profile);
      const totals = getNutritionTotals(date);
      const percent = metrics.targetCalories ? Math.round(totals.kcal / metrics.targetCalories * 100) : 0;
      const gap = metrics.targetCalories - totals.kcal;
      const gapClass = Math.abs(gap) <= metrics.targetCalories * .05 ? 'goal' : gap > 0 ? 'deficit' : 'surplus';
      const meals = getRecommendedMeals(date);
      const log = getDayLog(date);
      const entries = log.entries;
      const water = log.water;
      const filter = ui.recordFilter || 'all';
      const mealOrder = ['breakfast', 'lunch', 'dinner', 'snack', 'dessert'];
      const counts = Object.fromEntries(mealOrder.map(type => [type, entries.filter(entry => entry.mealType === type).length]));
      const totalRecords = entries.length + (water > 0 ? 1 : 0);
      const filteredEntries = filter === 'all' ? entries : filter === 'water' ? [] : entries.filter(entry => entry.mealType === filter);
      const macroTotals = {
        protein: totals.protein * 4,
        carbs: totals.carbs * 4,
        fat: totals.fat * 9
      };
      const macroTotalCalories = macroTotals.protein + macroTotals.carbs + macroTotals.fat;
      const macroPercents = {
        protein: macroTotalCalories ? Math.round(macroTotals.protein / macroTotalCalories * 100) : 0,
        carbs: macroTotalCalories ? Math.round(macroTotals.carbs / macroTotalCalories * 100) : 0,
        fat: macroTotalCalories ? Math.round(macroTotals.fat / macroTotalCalories * 100) : 0
      };
      const macroBar = (label, value, target, kind) => {
        const pct = target ? Math.round(value / target * 100) : 0;
        return `<div class="target-bar-row"><div class="target-label"><span><i class="macro-dot ${kind}" style="display:inline-block;margin-right:5px"></i>${label}</span><strong>${formatNum(value, 1)} / ${formatNum(target)}g · ${pct}%</strong></div><div class="progress-track"><div class="progress-fill ${kind === 'carb' ? 'dark' : kind === 'fat' ? 'green' : ''}" style="width:${clamp(pct, 0, 100)}%"></div></div></div>`;
      };
      const groups = filter === 'all'
        ? mealOrder.map(type => ({ type, entries: entries.filter(entry => entry.mealType === type) })).filter(group => group.entries.length)
        : filter === 'water' ? [] : [{ type: filter, entries: filteredEntries }];
      return `<div class="page-stack">
        <section class="diet-top">
          <div><div class="eyebrow">DAILY NUTRITION</div><h1 style="margin:5px 0 2px;font-size:clamp(23px,4vw,31px)">饮食记录</h1><p class="small muted" style="margin:0">${formatFullDate(date)} · 记录真实摄入，目标才有意义</p></div>
          <div class="row wrap"><div class="date-switcher"><button class="icon-btn small" data-action="diet-date-prev" aria-label="前一天">${icon('left', 15)}</button><button class="date-label" data-action="diet-today">${isToday(date) ? '今天' : formatMonthDay(date)}</button><button class="icon-btn small" data-action="diet-date-next" aria-label="后一天">${icon('right', 15)}</button></div><button class="btn btn-primary" data-action="open-add-food" data-meal="${filter !== 'all' && filter !== 'water' ? filter : 'breakfast'}">${icon('plus', 15)} 添加记录</button></div>
        </section>

        <section class="card diet-summary">
          <div class="card-head"><div><div class="eyebrow">CALORIE BALANCE</div><h2>今日营养快照</h2><p>目标由身体数据与「${escapeHTML(state.profile.goal)}」自动计算</p></div><div class="row"><span class="pill ${gap >= 0 ? 'rose' : 'gold'}">${gap >= 0 ? '缺口' : '盈余'} ${formatNum(Math.abs(gap))} kcal</span></div></div>
          <div class="diet-summary-main">
            ${ringHTML(percent, `${percent}%`, `已摄入 ${formatNum(totals.kcal)} kcal`, percent > 100 ? '' : '', '132px')}
            <div class="diet-summary-copy">
              <span class="small muted">每日目标</span>
              <div class="calorie-target-row"><strong>${formatNum(metrics.targetCalories)}</strong><span>kcal</span></div>
              <div class="gap-message ${gapClass}">${gap >= 0 ? `还可以摄入 ${formatNum(gap)} kcal，不必硬撑` : `超出目标 ${formatNum(Math.abs(gap))} kcal，下一餐清爽些`}</div>
              <div class="small muted" style="margin-top:9px">蛋白 ${metrics.protein}g · 碳水 ${metrics.carbs}g · 脂肪 ${metrics.fat}g</div>
            </div>
            <div class="macro-pie-wrap"><canvas id="macroPieCanvas" aria-label="三大营养素占比饼图"></canvas><div class="pie-center"><div><strong>${macroPercents.protein}%</strong><span>蛋白质供能</span></div></div></div>
            <div class="macro-legend grow" style="min-width:150px">
              <div class="macro-legend-row"><span><i class="macro-dot protein"></i>蛋白质</span><strong>${formatNum(totals.protein, 1)}g / ${metrics.protein}g · ${macroPercents.protein}%</strong></div>
              <div class="macro-legend-row"><span><i class="macro-dot carb"></i>碳水</span><strong>${formatNum(totals.carbs, 1)}g / ${metrics.carbs}g · ${macroPercents.carbs}%</strong></div>
              <div class="macro-legend-row"><span><i class="macro-dot fat"></i>脂肪</span><strong>${formatNum(totals.fat, 1)}g / ${metrics.fat}g · ${macroPercents.fat}%</strong></div>
            </div>
          </div>
          <div class="target-bars" style="margin-top:16px">
            ${macroBar('蛋白质', totals.protein, metrics.protein, 'protein')}
            ${macroBar('碳水化合物', totals.carbs, metrics.carbs, 'carb')}
            ${macroBar('脂肪', totals.fat, metrics.fat, 'fat')}
          </div>
        </section>

        <div class="diet-layout">
          <div class="main-stack">
            <section class="card">
              <div class="card-head"><div><div class="eyebrow">SMART MENU</div><h2>今日推荐食谱</h2><p>三餐配比已贴近目标，食材分量会自动缩放</p></div><button class="btn btn-soft btn-sm" data-action="vary-meals">${icon('refresh', 13)} 换一换</button></div>
              <div class="meal-grid">
                ${meals.map(meal => `<article class="meal-card">
                  <div class="meal-card-head"><div><div class="meal-type">${icon(meal.mealType === 'breakfast' ? 'bolt' : meal.mealType === 'lunch' ? 'meal' : 'spark', 12)} ${MEAL_TYPES[meal.mealType].label}推荐</div><h3>${escapeHTML(meal.name)}</h3></div><div class="meal-kcal"><strong>${meal.kcal}</strong><span>kcal</span></div></div>
                  <div class="meal-body"><ul class="ingredient-list">${meal.ingredients.map(item => `<li>${escapeHTML(item.name)} ${formatGrams(item.grams)}g</li>`).join('')}</ul><p class="method">${escapeHTML(meal.method)}</p><div class="meal-foot"><span class="meal-macros">P ${formatNum(meal.protein, 1)} · C ${formatNum(meal.carbs, 1)} · F ${formatNum(meal.fat, 1)}</span><div class="meal-actions"><button class="btn btn-ghost btn-sm" style="color:var(--rose-deep)" data-action="log-recipe" data-meal-type="${meal.mealType}">记入</button></div></div></div>
                </article>`).join('')}
              </div>
              <div class="modal-tip" style="margin-top:14px">${icon('info', 14)} 食谱为参考方案，可根据厨房现有食材替换同类食物；烹饪油已计入热量。</div>
            </section>

            <section class="card">
              <div class="card-head"><div><div class="eyebrow">FOOD LOG</div><h2>饮食明细</h2><p>${entries.length} 条食物记录 · 饮水 ${formatNum(water)} ml</p></div><button class="btn btn-soft btn-sm" data-action="open-add-food" data-meal="${filter !== 'all' && filter !== 'water' ? filter : 'breakfast'}">${icon('plus', 13)} 添加</button></div>
              <div class="chip-row" style="margin-bottom:13px">
                <button class="chip ${filter === 'all' ? 'active' : ''}" data-action="record-filter" data-filter="all">全部 <span style="opacity:.65">${totalRecords}</span></button>
                ${mealOrder.map(type => `<button class="chip ${filter === type ? 'active' : ''}" data-action="record-filter" data-filter="${type}">${MEAL_TYPES[type].label} ${counts[type] ? `<span style="opacity:.65">${counts[type]}</span>` : ''}</button>`).join('')}
                <button class="chip ${filter === 'water' ? 'active' : ''}" data-action="record-filter" data-filter="water">饮水 ${water ? `<span style="opacity:.65">1</span>` : ''}</button>
              </div>
              <div class="record-list">
                ${filter === 'water' ? recordWaterRowHTML(date) : groups.length ? groups.map(group => `<div><div class="record-group-title"><span>${MEAL_TYPES[group.type].label}</span><span>${formatNum(group.entries.reduce((sum, entry) => sum + entry.kcal, 0))} kcal</span></div>${group.entries.map(recordEntryHTML).join('')}</div>`).join('') : emptyRecordHTML(filter === 'all' ? '今天还没有饮食记录' : `还没有${MEAL_TYPES[filter]?.label || ''}记录`)}
                ${filter === 'all' && water > 0 ? `<div><div class="record-group-title"><span>饮水</span><span>${formatNum(water)} ml</span></div>${recordWaterRowHTML(date)}</div>` : ''}
              </div>
              <div class="add-record-bar"><button class="btn btn-secondary btn-wide" data-action="open-add-food" data-meal="${filter !== 'all' && filter !== 'water' ? filter : 'breakfast'}">${icon('search', 14)} 从食物库中添加</button></div>
            </section>
          </div>

          <aside class="side-stack">
            <section class="card water-card">
              <div class="card-head"><div><div class="eyebrow">WATER</div><h2>饮水记录</h2><p>六类记录之一 · 建议少量多次</p></div><span class="pill ${water >= metrics.waterTarget ? 'green' : 'rose'}">${water >= metrics.waterTarget ? '已达标' : `${Math.round(water / metrics.waterTarget * 100)}%`}</span></div>
              ${recordWaterRowHTML(date)}
              <div class="water-grid" style="margin-top:14px">${Array.from({ length: 8 }, (_, i) => `<button class="water-cup ${i < Math.ceil(water / Math.max(200, Math.round(metrics.waterTarget / 8 / 50) * 50)) ? 'filled' : ''}" data-action="water-cup" data-index="${i}" data-amount="${Math.max(200, Math.round(metrics.waterTarget / 8 / 50) * 50)}" aria-label="记录第 ${i + 1} 杯水">${icon('water', 15)}</button>`).join('')}</div>
            </section>

            <section class="card">
              <div class="card-head"><div><div class="eyebrow">MEAL RHYTHM</div><h2>今日分配建议</h2><p>把目标拆成更好完成的小份</p></div></div>
              <div class="stack-sm">
                ${['早餐 28%','午餐 40%','晚餐 32%'].map((label, index) => `<div class="row" style="padding:9px 10px;background:#F8FAFB;border-radius:10px"><span class="record-icon ${index === 1 ? 'blue' : index === 2 ? 'gold' : ''}">${index + 1}</span><div class="grow"><strong style="font-size:10.5px">${label.split(' ')[0]}</strong><div class="tiny muted">约 ${formatNum(metrics.targetCalories * [0.28, 0.4, 0.32][index])} kcal</div></div><span class="small muted">${label.split(' ')[1]}</span></div>`).join('')}

    function getTrendData(metric, period, includeAllIfEmpty = false) {
      const cutoff = addDays(todayKey(), -period + 1);
      let data = [...state.measurements]
        .filter(item => item[metric] !== '' && item[metric] !== null && item[metric] !== undefined && item.date >= cutoff)
        .sort((a, b) => a.date.localeCompare(b.date));
      if (!data.length && includeAllIfEmpty) {
        data = [...state.measurements]
          .filter(item => item[metric] !== '' && item[metric] !== null && item[metric] !== undefined)
          .sort((a, b) => a.date.localeCompare(b.date));
      }
      return data;
    }

    function showOnboardingError(message) {
      const el = document.getElementById('onboardingError');
      if (!el) return;
      el.innerHTML = `${icon('info', 14)} ${escapeHTML(message)}`;
      el.classList.add('show');
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function validateOnboarding(step, show = true) {
      let message = '';
      if (step === 1) {
        if (!['male', 'female'].includes(onboarding.gender)) message = '请选择生理性别，用于计算基础代谢。';
        else if (!(numberOr(onboarding.age) >= 12 && numberOr(onboarding.age) <= 90)) message = '年龄需要在 12–90 岁之间。';
        else if (!(numberOr(onboarding.height) >= 120 && numberOr(onboarding.height) <= 230)) message = '身高需要在 120–230 cm 之间。';
        else if (!(numberOr(onboarding.weight) >= 30 && numberOr(onboarding.weight) <= 250)) message = '体重需要在 30–250 kg 之间。';
      } else if (step === 2) {
        if (onboarding.bodyfat !== '' && !(numberOr(onboarding.bodyfat) >= 3 && numberOr(onboarding.bodyfat) <= 60)) message = '体脂率留空或填写 3–60% 之间的数字。';
        else if (!ACTIVITIES[onboarding.activity]) message = '请选择你的运动基础。';
      } else if (step === 3) {
        if (!GOALS.some(goal => goal.id === onboarding.goal)) message = '请选择健身目标。';
        else if (!SCENES[onboarding.scene]) message = '请选择运动场景。';
        else if (![3, 4, 5, 6].includes(numberOr(onboarding.days))) message = '每周训练天数需要在 3–6 天之间。';
      }
      if (message && show) showOnboardingError(message);
      return !message;
    }

              ${step > 1 ? `<button type="button" class="btn btn-secondary btn-back" data-action="onboarding-back">上一步</button>` : ''}

    function finishOnboarding() {
      if (!validateOnboarding(1, true) || !validateOnboarding(2, true) || !validateOnboarding(3, true)) return;
      const profile = {
        gender: onboarding.gender,
        age: Math.round(numberOr(onboarding.age)),
        height: round(numberOr(onboarding.height), 1),
        weight: round(numberOr(onboarding.weight), 1),
        bodyfat: onboarding.bodyfat === '' ? null : round(numberOr(onboarding.bodyfat), 1),
        activity: onboarding.activity,
        goal: onboarding.goal,
        scene: onboarding.scene,
        days: Number(onboarding.days),
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
      state.profile = profile;
      state.planStart = todayKey();
      if (!state.logs[todayKey()]) state.logs[todayKey()] = { entries: [], water: 0 };
      const existing = state.measurements.find(item => item.date === todayKey());
      if (!existing) {
        state.measurements.push({ id: uid('measure'), date: todayKey(), weight: profile.weight, bodyfat: profile.bodyfat, chest: '', waist: '', hips: '', arms: '', legs: '', createdAt: new Date().toISOString() });
      }
      saveState();
      ui.tab = 'today';
      ui.trainingDate = todayKey();
      ui.dietDate = todayKey();
      renderApp();

    function saveCheckin() {
      const form = document.getElementById('checkinForm');
      if (!form) return;
      const date = form.dataset.date;
      const plan = getPlanContext(date);
      const duration = numberOr(document.getElementById('checkinDuration')?.value, 0);
      const weightInput = document.getElementById('checkinWeight')?.value ?? '';
      const manualWeight = weightInput.trim() === '' ? null : numberOr(weightInput, 0);
      const rpe = numberOr(document.getElementById('checkinRpe')?.value, 7);
      const notes = document.getElementById('checkinNotes')?.value.trim() || '';
      const errorEl = document.getElementById('checkinError');
      if (duration < 1 || duration > 300) {
        if (errorEl) { errorEl.textContent = '实际训练时长需要在 1–300 分钟之间。'; errorEl.classList.add('show'); }
        return;
      }
      if (manualWeight !== null && (manualWeight < 0 || manualWeight > 500)) {
        if (errorEl) { errorEl.textContent = '负重 / 体重需要在 0–500 kg 之间。'; errorEl.classList.add('show'); }
        return;
      }
      let actualSets = 0;
      let plannedSets = 0;
      let completionSum = 0;
      let rowCount = 0;
      let weightTotal = 0;
      let weightSetCount = 0;
      const exerciseLogs = {};
      form.querySelectorAll('[data-checkin-row]').forEach(row => {
        const id = row.dataset.exId;
        const type = row.dataset.type;
        if (type === 'strength') {
          const sets = clamp(numberOr(row.querySelector('[data-k="sets"]')?.value, 0), 0, 12);
          const reps = clamp(numberOr(row.querySelector('[data-k="reps"]')?.value, 0), 0, 60);
          const kg = clamp(numberOr(row.querySelector('[data-k="weight"]')?.value, 0), 0, 500);
          const rowPlannedSets = clamp(numberOr(row.dataset.plannedSets, 0), 0, 12);
          const rowPlannedReps = clamp(numberOr(row.dataset.plannedReps, 0), 0, 60);
          actualSets += sets;
          plannedSets += rowPlannedSets;
          const plannedVolume = rowPlannedSets * rowPlannedReps;
          if (plannedVolume > 0) {
            completionSum += clamp((sets * reps) / plannedVolume, 0, 1.2);
            rowCount += 1;
          }
          if (kg > 0 && sets > 0) {
            weightTotal += kg * sets;
            weightSetCount += sets;
          }
          exerciseLogs[id] = { type: 'strength', sets, reps, weight: kg };
        } else if (type === 'timed') {
          const sets = clamp(numberOr(row.querySelector('[data-k="sets"]')?.value, 0), 0, 12);
          const seconds = clamp(numberOr(row.querySelector('[data-k="seconds"]')?.value, 0), 0, 300);
          const kg = clamp(numberOr(row.querySelector('[data-k="weight"]')?.value, 0), 0, 500);
          const rowPlannedSets = clamp(numberOr(row.dataset.plannedSets, 0), 0, 12);
          const rowPlannedSeconds = clamp(numberOr(row.dataset.plannedSeconds, 0), 0, 300);
          actualSets += sets;
          plannedSets += rowPlannedSets;
          const plannedVolume = rowPlannedSets * rowPlannedSeconds;
          if (plannedVolume > 0) {
            completionSum += clamp((sets * seconds) / plannedVolume, 0, 1.2);
            rowCount += 1;
          }
          if (kg > 0 && sets > 0) {
            weightTotal += kg * sets;
            weightSetCount += sets;
          }
          exerciseLogs[id] = { type: 'timed', sets, seconds, weight: kg };
        } else {
          const minutes = clamp(numberOr(row.querySelector('[data-k="minutes"]')?.value, 0), 0, 180);
          const plannedMinutes = clamp(numberOr(row.dataset.plannedMinutes, 0), 0, 180);
          if (plannedMinutes > 0) {
            completionSum += clamp(minutes / plannedMinutes, 0, 1.2);
            rowCount += 1;
          }
          exerciseLogs[id] = { type: 'cardio', minutes };
        }
      });
      const derivedWeight = weightSetCount > 0 ? round(weightTotal / weightSetCount, 1) : 0;
      const weight = manualWeight === null ? derivedWeight : round(manualWeight, 1);
      const completion = clamp(rowCount > 0 ? completionSum / rowCount : duration / Math.max(1, plan.duration), 0, 1);
      const calories = Math.round(plan.calories * clamp(duration / Math.max(1, plan.duration), .4, 1.4));
      state.checkins[date] = {
        date, duration, weight, rpe, notes, completion: round(completion, 2), actualSets, plannedSets,
        plannedDuration: plan.duration, calories, exerciseLogs, savedAt: new Date().toISOString()
      };
      saveState();
      const newAchievements = evaluateAchievements();
      closeModal();
      renderApp();
      showToast(`训练已打卡：${duration} 分钟 · 完成度 ${Math.round(completion * 100)}%`, { icon: 'check' });
      if (newAchievements.length) celebrateAchievements(newAchievements);
    }

    function foodMatch(food, query) {
      if (!query) return true;
      const normalized = normalizeText(query);
      return normalizeText(food.name).includes(normalized) || food.aliases.some(alias => normalizeText(alias).includes(normalized)) || normalizeText(food.category).includes(normalized);
    }

    function getFilteredFoods() {
      if (!foodModal) return [];
      let list = getAllFoods().filter(food => foodMatch(food, foodModal.query));
      if (foodModal.category !== '全部') list = list.filter(food => food.category === foodModal.category);
      if (!foodModal.query) {
        if (foodModal.category === '全部') {
          const popular = POPULAR_FOOD_NAMES.map(name => list.find(food => food.name === name)).filter(Boolean);
          const rest = list.filter(food => !POPULAR_FOOD_NAMES.includes(food.name)).slice(0, 12);
          list = [...popular, ...rest];
        } else list = list.slice(0, 24);
      } else {
        const q = normalizeText(foodModal.query);
        list.sort((a, b) => {
          const aStarts = normalizeText(a.name).startsWith(q) ? 0 : 1;
          const bStarts = normalizeText(b.name).startsWith(q) ? 0 : 1;
          return aStarts - bStarts || a.name.length - b.name.length;
        });
      }
      return list.slice(0, 32);
    }

    function saveCustomFood() {
      const name = document.getElementById('customFoodName')?.value.trim();
      const category = document.getElementById('customFoodCategory')?.value || '自定义';
      const serving = numberOr(document.getElementById('customFoodServing')?.value, 100);
      const kcal = numberOr(document.getElementById('customFoodKcal')?.value, NaN);
      const protein = numberOr(document.getElementById('customFoodProtein')?.value, NaN);
      const carbs = numberOr(document.getElementById('customFoodCarbs')?.value, NaN);
      const fat = numberOr(document.getElementById('customFoodFat')?.value, NaN);
      const errorEl = document.getElementById('customFoodError');
      let message = '';
      if (!name) message = '请填写食物名称。';
      else if (getAllFoods().some(food => normalizeText(food.name) === normalizeText(name))) message = '食物库中已有同名食物，请换一个名称。';
      else if (!Number.isFinite(kcal) || kcal < 0 || kcal > 1000) message = '热量需要填写 0–1000 kcal。';
      else if (!Number.isFinite(protein) || !Number.isFinite(carbs) || !Number.isFinite(fat) || [protein,carbs,fat].some(value => value < 0 || value > 100)) message = '三大营养素需要是 0–100g 之间的数字。';
      else if (serving < 1 || serving > 2000) message = '一份重量需要在 1–2000g 之间。';
      if (message) {
        if (errorEl) { errorEl.textContent = message; errorEl.classList.add('show'); }
        return;
      }
      const custom = {
        id: uid('custom'), name, category, serving: round(serving, 1), kcal: round(kcal, 1),
        protein: round(protein, 1), carbs: round(carbs, 1), fat: round(fat, 1), createdAt: new Date().toISOString()
      };
      state.customFoods.push(custom);
      saveState();
      if (foodModal) {
        foodModal.selectedId = custom.id;
        foodModal.grams = custom.serving || 100;
        foodModal.unit = 'g';
        renderAddFoodModal();
      } else {
        closeModal();
        renderApp();

    function openMeasurement(date = todayKey()) {

      const profile = state.profile;
      openModal(`${modalHeaderHTML(existing.id ? '更新身体记录' : '记录身体数据', '同一天再次保存会更新该日记录')}

            <div class="field"><label for="measureWeight">体重 *</label><div class="input-wrap"><input class="input" id="measureWeight" type="number" min="30" max="250" step=".1" value="${existing.weight ?? profile.weight}"><span class="input-suffix">kg</span></div></div>

            ${[['chest','胸围'],['waist','腰围'],['hips','臀围'],['arms','臂围'],['legs','腿围']].map(([key, label]) => `<div class="field"><label for="measure-${key}">${label}（选填）</label><div class="input-wrap"><input class="input" id="measure-${key}" type="number" min="1" max="250" step=".1" value="${existing[key] ?? ''}"><span class="input-suffix">cm</span></div></div>`).join('')}

        </form></div>`, { type: 'measurement' });

    function saveMeasurement() {
      const date = document.getElementById('measureDate')?.value;
      const weight = numberOr(document.getElementById('measureWeight')?.value, 0);
      const bodyfat = document.getElementById('measureBodyfat')?.value === '' ? null : numberOr(document.getElementById('measureBodyfat')?.value, NaN);
      const values = {
        chest: document.getElementById('measure-chest')?.value === '' ? null : numberOr(document.getElementById('measure-chest')?.value, NaN),
        waist: document.getElementById('measure-waist')?.value === '' ? null : numberOr(document.getElementById('measure-waist')?.value, NaN),
        hips: document.getElementById('measure-hips')?.value === '' ? null : numberOr(document.getElementById('measure-hips')?.value, NaN),
        arms: document.getElementById('measure-arms')?.value === '' ? null : numberOr(document.getElementById('measure-arms')?.value, NaN),
        legs: document.getElementById('measure-legs')?.value === '' ? null : numberOr(document.getElementById('measure-legs')?.value, NaN)
      };
      const errorEl = document.getElementById('measurementError');
      let message = '';
      if (!date || date > todayKey()) message = '请选择今天或过去的日期。';
      else if (weight < 30 || weight > 250) message = '体重需要在 30–250 kg 之间。';
      else if (bodyfat !== null && (bodyfat < 3 || bodyfat > 60)) message = '体脂率需要留空或填写 3–60%。';
      else if (Object.values(values).some(value => value !== null && (value < 1 || value > 250))) message = '围度数据需要是 1–250 cm 之间的数字或留空。';
      if (message) {
        if (errorEl) { errorEl.textContent = message; errorEl.classList.add('show'); }
        return;
      }
      const existingIndex = state.measurements.findIndex(item => item.date === date);
      const record = {
        id: existingIndex >= 0 ? state.measurements[existingIndex].id : uid('measure'),
        date, weight: round(weight, 1), bodyfat: bodyfat === null ? null : round(bodyfat, 1),
        ...values, createdAt: existingIndex >= 0 ? state.measurements[existingIndex].createdAt : new Date().toISOString()
      };
      if (existingIndex >= 0) state.measurements[existingIndex] = record;
      else state.measurements.push(record);
      state.measurements.sort((a, b) => a.date.localeCompare(b.date));
      const latest = state.measurements[state.measurements.length - 1];
      if (latest?.weight) state.profile.weight = latest.weight;
      if (latest?.bodyfat) state.profile.bodyfat = latest.bodyfat;
      saveState();
      const newAchievements = evaluateAchievements();
      closeModal();
      renderApp();
      showToast('身体记录已保存，趋势图已更新。', { icon: 'scale' });
      if (newAchievements.length) celebrateAchievements(newAchievements);
    }

    // ---------- Settings, data and notifications ----------
    function showFormError(id, message) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = message;
      el.classList.add('show');
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    function saveProfileFromModal() {
      const gender = document.getElementById('editGender')?.value;
      const age = numberOr(document.getElementById('editAge')?.value, 0);
      const height = numberOr(document.getElementById('editHeight')?.value, 0);
      const weight = numberOr(document.getElementById('editWeight')?.value, 0);
      const bodyfatRaw = document.getElementById('editBodyfat')?.value;
      const bodyfat = bodyfatRaw === '' ? null : numberOr(bodyfatRaw, NaN);
      const days = numberOr(document.getElementById('editDays')?.value, 4);
      const activity = document.getElementById('editActivity')?.value;
      const goal = document.getElementById('editGoal')?.value;
      const scene = document.getElementById('editScene')?.value;
      let message = '';
      if (!['female', 'male'].includes(gender)) message = '请选择生理性别。';
      else if (age < 12 || age > 90) message = '年龄需要在 12–90 岁之间。';
      else if (height < 120 || height > 230) message = '身高需要在 120–230 cm 之间。';
      else if (weight < 30 || weight > 250) message = '体重需要在 30–250 kg 之间。';
      else if (bodyfat !== null && (bodyfat < 3 || bodyfat > 60)) message = '体脂率留空或填写 3–60%。';
      else if (!ACTIVITIES[activity]) message = '请选择有效的运动基础。';
      else if (!GOALS.some(item => item.id === goal)) message = '请选择有效的健身目标。';
      else if (!SCENES[scene]) message = '请选择有效的运动场景。';
      else if (![3,4,5,6].includes(days)) message = '每周训练天数需要是 3–6 天。';
      if (message) { showFormError('editProfileError', message); return; }
      state.profile = {
        ...state.profile, gender, age: Math.round(age), height: round(height, 1), weight: round(weight, 1),
        bodyfat: bodyfat === null ? null : round(bodyfat, 1), days, activity, goal, scene,
        updatedAt: new Date().toISOString()
      };
      state.planStart = todayKey();
      ui.trainingDate = todayKey();
      saveState();
      closeModal();
      renderApp();
      showToast('身体数据已更新，指标重新计算，训练计划从今天重置。', { icon: 'refresh' });
    }

    function setWaterAmount(date, amount, options = {}) {
      const log = getDayLog(date);
      log.water = clamp(Math.round(numberOr(amount) / 10) * 10, 0, 15000);
      saveState();
      const newlyUnlocked = evaluateAchievements();
      renderApp();
      if (newlyUnlocked.length) celebrateAchievements(newlyUnlocked);
      if (options.toast) showToast(options.toast, { icon: 'water' });
    }

    function waterDateFrom(trigger) {
      if (trigger.dataset.date) return trigger.dataset.date;
      if (ui.tab === 'diet') return ui.dietDate;
      return todayKey();
    }

    function saveRemindersSettings() {
      const enabled = Boolean(document.getElementById('reminderTrainingEnabled')?.checked);
      const waterEnabled = Boolean(document.getElementById('reminderWaterEnabled')?.checked);
      const training = document.getElementById('reminderTrainingTime')?.value || '18:30';
      const water = document.getElementById('reminderWaterTime')?.value || '10:00';
      state.reminders = { enabled, waterEnabled, training, water };
      saveState();
      const finish = () => {
        renderApp();
        initReminderTimer();
        let note = '提醒设置已保存。';
        if ((enabled || waterEnabled) && !('Notification' in window)) note = '提醒已保存；当前浏览器不支持系统通知，将使用页面内提醒。';
        else if ((enabled || waterEnabled) && Notification.permission !== 'granted') note = '提醒已保存；系统通知未授权，将使用页面内提醒。';
        showToast(note, { icon: 'bell' });
      };
      if ((enabled || waterEnabled) && 'Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission().then(finish).catch(finish);
      } else finish();
    }

    function sendBrowserNotification(title, body) {
      let delivered = false;
      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification(title, { body, tag: 'pawfit-reminder' });
          delivered = true;
        } catch (error) {
          console.warn('系统通知发送失败', error);
        }
      }
      if (!delivered) showToast(`${title} · ${body}`, { icon: 'bell', duration: 6000 });
    }

    function checkReminders() {
      if (!state.profile) return;
      const now = new Date();
      const time = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const date = todayKey();
      state.reminderSent = state.reminderSent || {};
      let changed = false;
      if (state.reminders.enabled && time === state.reminders.training && state.reminderSent.training !== date) {
        sendBrowserNotification('该训练啦 · PawFit', '今天也为自己动一动，记得先热身。');
        state.reminderSent.training = date;
        changed = true;
      }
      if (state.reminders.waterEnabled && time === state.reminders.water && state.reminderSent.water !== date) {
        sendBrowserNotification('喝口水吧 · PawFit', `今天的水喝够了吗？目标 ${formatNum(calculateMetrics(state.profile).waterTarget)} ml。`);
        state.reminderSent.water = date;
        changed = true;
      }
      if (changed) saveState();
    }

    function initReminderTimer() {
      if (reminderTimer) clearInterval(reminderTimer);
      reminderTimer = setInterval(checkReminders, 30000);
    }

    function exportData() {
      const payload = { ...state, app: 'PawFit', exportedAt: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = `pawfit-backup-${todayKey()}.json`;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1200);
      showToast('备份已导出，包含训练、饮食与身体记录。', { icon: 'download' });
    }

    async function importDataFile(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        if (!parsed || typeof parsed !== 'object' || !parsed.profile) throw new Error('备份中缺少用户资料。');
        state = {
          ...clone(DEFAULT_STATE), ...parsed,
          logs: parsed.logs || {}, checkins: parsed.checkins || {},
          measurements: Array.isArray(parsed.measurements) ? parsed.measurements : [],
          customFoods: Array.isArray(parsed.customFoods) ? parsed.customFoods : [],
          achievements: parsed.achievements || {}, recipeOffset: parsed.recipeOffset || {},
          reminders: { ...clone(DEFAULT_STATE.reminders), ...(parsed.reminders || {}) },
          version: APP_VERSION
        };
        state.planStart = state.planStart || todayKey();
        saveState();
        closeModal();
        ui.tab = 'today';
        ui.trainingDate = todayKey();
        ui.dietDate = todayKey();
        evaluateAchievements();
        renderApp();
        initReminderTimer();
        showToast('备份已恢复，所有本地记录已载入。', { icon: 'upload' });
      } catch (error) {
        showToast('导入失败：' + (error.message || '文件格式不正确'), { icon: 'info', duration: 5000 });
      } finally {
        event.target.value = '';
      }
    }

    function beginAddWaterFromModal() {
      const amount = numberOr(document.getElementById('waterAmountInput')?.value, 0);
      if (amount < 50 || amount > 2000) { showToast('单次饮水量需要在 50–2000 ml 之间。', { icon: 'info' }); return; }
      const date = foodModal?.date || ui.dietDate;
      const next = getWater(date) + amount;
      closeModal();
      setWaterAmount(date, next, { toast: `已记录饮水 ${amount} ml` });
    }
