<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111E30">
  <meta name="description" content="PawFit 喵练：离线可用的个人健身饮食规划工具。">
  <title>PawFit 喵练 · 每日健身饮食规划</title>
  <style>
    :root {
      --ink: #111E30;
      --ink-2: #1B2A40;
      --ink-3: #2B3B51;
      --rose: #C36F8B;
      --rose-deep: #A95672;
      --rose-soft: #F7E8ED;
      --rose-mist: #FBF3F5;
      --ice: #9AA4B0;
      --ice-light: #D8DEE6;
      --bg: #F3F5F7;
      --card: #FFFFFF;
      --success: #5F9A84;
      --success-soft: #EAF4F0;
      --gold: #C79A5B;
      --gold-soft: #FBF3E5;
      --danger: #B5545C;
      --line: #E7EBF0;
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --shadow-sm: 0 2px 8px rgba(17, 30, 48, .04);
      --shadow: 0 14px 38px rgba(17, 30, 48, .08);
      --shadow-lg: 0 28px 70px rgba(17, 30, 48, .16);
      --ease: cubic-bezier(.2, .75, .25, 1);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-width: 320px;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% -10%, rgba(195, 111, 139, .10), transparent 32rem),
        radial-gradient(circle at 92% 12%, rgba(154, 164, 176, .09), transparent 28rem),
        var(--bg);
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    body.modal-open { overflow: hidden; }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button, [role="button"] { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 3px solid rgba(195, 111, 139, .36); outline-offset: 3px; }
    h1, h2, h3, h4, p { margin-top: 0; }
    h1, h2, h3, h4 { line-height: 1.18; letter-spacing: -.02em; }
    a { color: inherit; }
    svg { display: block; }
    [hidden] { display: none !important; }
    .shell { width: min(1200px, 100% - 32px); margin-inline: auto; }
    .muted { color: var(--ice); }
    .small { font-size: 12.5px; }
    .tiny { font-size: 11.5px; }
    .nowrap { white-space: nowrap; }
    .sr-only {
      position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    /* Navigation */
    .topbar {
      position: sticky; top: 0; z-index: 40;
      background: rgba(243, 245, 247, .88);
      border-bottom: 1px solid rgba(231, 235, 240, .8);
      backdrop-filter: blur(18px);
    }
    .topbar-inner { display: flex; align-items: center; justify-content: space-between; min-height: 70px; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0; border: 0; background: none; cursor: pointer; text-align: left; }
    .brand-mark {
      width: 40px; height: 40px; display: grid; place-items: center; border-radius: 14px;
      color: #fff; background: linear-gradient(140deg, var(--ink-2), var(--ink));
      box-shadow: 0 7px 18px rgba(17, 30, 48, .20);
    }
    .brand-mark svg { width: 28px; height: 28px; }
    .brand-copy strong { display: block; font-size: 16px; letter-spacing: -.02em; }
    .brand-copy span { display: block; color: var(--ice); font-size: 9px; letter-spacing: .18em; margin-top: -1px; }
    .desktop-nav { display: none; align-items: center; gap: 4px; padding: 5px; border-radius: 16px; background: #fff; box-shadow: var(--shadow-sm); }
    .desktop-tab {
      border: 0; background: transparent; color: var(--ice); cursor: pointer;
      padding: 9px 20px; border-radius: 12px; font-weight: 650; font-size: 13px;
      transition: color .2s var(--ease), background .2s var(--ease), transform .2s var(--ease);
    }
    .desktop-tab:hover { color: var(--ink); background: #F6F8FA; }
    .desktop-tab.active { color: #fff; background: var(--ink); box-shadow: 0 6px 14px rgba(17, 30, 48, .18); }
    .topbar-side { display: flex; align-items: center; gap: 10px; margin-left: auto; }
    .header-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 999px;
      background: #fff; border: 1px solid var(--line); color: var(--ink-3);
      font-size: 11.5px; font-weight: 700; white-space: nowrap;
    }
    .header-pill .flame { color: var(--rose); }

    /* Final output version: focus & layout */
    .page { display: none; padding: 22px 0 110px; min-width: 0; }
    .page.active { display: block; animation: pageIn .45s var(--ease) both; }
    @keyframes pageIn { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
    .page-stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; min-width: 0; }
    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; min-width: 0; }
    .page-stack > *, .dashboard-grid > *, .main-stack > *, .side-stack > *,
    .training-layout > *, .diet-layout > *, .my-layout > *, .record-layout > *,
    .main-stack, .side-stack, .training-layout, .diet-layout, .my-layout, .record-layout { min-width: 0; }
    .card {
      position: relative; background: var(--card); border: 1px solid rgba(231, 235, 240, .9);
      border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm);
    }
    .card.accent-border { border-top: 3px solid var(--rose); }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
    .card-head h2, .card-head h3 { margin: 0; font-size: 17px; }
    .card-head p { margin: 4px 0 0; color: var(--ice); font-size: 12.5px; }
    .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 2px 0 -2px; }
    .section-head h2 { margin: 0; font-size: 20px; }
    .section-head p { margin: 4px 0 0; color: var(--ice); font-size: 12.5px; }
    .eyebrow { color: var(--rose-deep); font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    .stack { display: grid; gap: 12px; }
    .stack-sm { display: grid; gap: 8px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .wrap { flex-wrap: wrap; }
    .grow { flex: 1; }

    /* Buttons & controls */
    .btn {
      appearance: none; border: 1px solid transparent; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      min-height: 42px; padding: 10px 16px; border-radius: 13px;
      font-size: 13px; font-weight: 750; letter-spacing: -.01em;
      transition: transform .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease);
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0) scale(.985); }
    .btn:disabled { opacity: .48; cursor: not-allowed; transform: none; }
    .btn-primary { color: #fff; background: var(--rose); box-shadow: 0 8px 20px rgba(195, 111, 139, .24); }
    .btn-primary:hover { background: var(--rose-deep); box-shadow: 0 10px 24px rgba(195, 111, 139, .30); }
    .btn-dark { color: #fff; background: var(--ink); box-shadow: 0 8px 20px rgba(17, 30, 48, .16); }
    .btn-dark:hover { background: var(--ink-3); }
    .btn-secondary { color: var(--ink); background: #fff; border-color: var(--line); box-shadow: var(--shadow-sm); }
    .btn-secondary:hover { border-color: var(--ice-light); background: #FBFCFD; }
    .btn-ghost { color: var(--ink-3); background: transparent; border-color: transparent; }
    .btn-ghost:hover { background: #F2F5F8; }
    .btn-soft { color: var(--rose-deep); background: var(--rose-soft); }
    .btn-soft:hover { background: #F2DDE4; }
    .btn-danger { color: var(--danger); background: #FCEEF0; }
    .btn-sm { min-height: 34px; padding: 7px 11px; border-radius: 10px; font-size: 11.5px; }
    .btn-wide { width: 100%; }
    .icon-btn {
      width: 38px; height: 38px; padding: 0; border: 1px solid var(--line); border-radius: 12px;
      display: inline-grid; place-items: center; background: #fff; color: var(--ink-3); cursor: pointer;
      transition: transform .18s var(--ease), background .18s var(--ease), border-color .18s var(--ease);
    }
    .icon-btn:hover { background: #F8FAFB; border-color: var(--ice-light); transform: translateY(-1px); }
    .icon-btn svg { width: 18px; height: 18px; }
    .icon-btn.small { width: 30px; height: 30px; border-radius: 9px; }
    .icon-btn.small svg { width: 15px; height: 15px; }
    .chip-row { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip {
      border: 1px solid var(--line); background: #fff; color: var(--ice); cursor: pointer;
      padding: 7px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap;
      transition: all .18s var(--ease);
    }
    .chip:hover { color: var(--ink); border-color: var(--ice-light); }
    .chip.active { color: #fff; background: var(--ink); border-color: var(--ink); }
    .pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 999px; background: #F4F6F8; color: var(--ink-3); font-size: 10.5px; font-weight: 750; white-space: nowrap; }
    .pill.rose { color: var(--rose-deep); background: var(--rose-soft); }
    .pill.green { color: var(--success); background: var(--success-soft); }
    .pill.gold { color: #976E38; background: var(--gold-soft); }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: none; }
    .tag { display: inline-flex; align-items: center; padding: 3px 7px; border-radius: 7px; background: #F5F7F9; color: var(--ice); font-size: 9.5px; font-weight: 700; white-space: nowrap; }

    /* Hero */
    .hero {
      position: relative; overflow: hidden; border-radius: var(--radius-xl); color: #fff;
      background:
        radial-gradient(circle at 84% 12%, rgba(195, 111, 139, .32), transparent 15rem),
        radial-gradient(circle at 10% 120%, rgba(154, 164, 176, .22), transparent 20rem),
        linear-gradient(125deg, #111E30 12%, #1B2A40 100%);
      padding: 26px; box-shadow: 0 22px 45px rgba(17, 30, 48, .16); min-width: 0;
    }
    .hero::after {
      content: ""; position: absolute; width: 250px; height: 250px; border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .08); right: -80px; bottom: -135px;
      box-shadow: 0 0 0 36px rgba(255, 255, 255, .025), 0 0 0 80px rgba(255, 255, 255, .02);
      pointer-events: none;
    }
    .hero-top { display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,.62); font-size: 11px; }
    .hero-layout { position: relative; z-index: 1; display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; min-width: 0; }
    .hero-layout > div:first-child { min-width: 0; }
    .hero h1 { margin: 12px 0 7px; font-size: clamp(25px, 5vw, 38px); max-width: 560px; letter-spacing: -.045em; }
    .hero h1 em { color: #E3A6B8; font-style: normal; }
    .hero-sub { margin: 0; max-width: 530px; color: rgba(255,255,255,.65); font-size: 12.5px; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 20px; }
    .hero-actions .btn-secondary { background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.14); color: #fff; box-shadow: none; backdrop-filter: blur(8px); }
    .hero-actions .btn-secondary:hover { background: rgba(255,255,255,.16); }
    .hero-actions .btn-soft { background: #E5A6B9; color: var(--ink); }
    .hero-mascot { width: 116px; flex: none; align-self: center; filter: drop-shadow(0 15px 22px rgba(0,0,0,.16)); }
    .hero-mascot svg { width: 100%; height: auto; }
    .hero-mini-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
    .hero-mini { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px; border-radius: 10px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.07); color: rgba(255,255,255,.8); font-size: 10.5px; font-weight: 650; }
    .hero-mini strong { color: #fff; font-size: 13px; }
    .hero-date-stamp { display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; border-radius: 9px; background: rgba(255,255,255,.09); color: #fff; font-size: 10.5px; }

    /* Dashboard */
    .stats-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .stat-tile { border-radius: var(--radius-md); padding: 14px; background: #F7F9FA; border: 1px solid #EFF2F5; min-width: 0; }
    .stat-tile.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
    .stat-tile.rose { background: var(--rose-soft); border-color: #F2DDE4; }
    .stat-tile.green { background: var(--success-soft); border-color: #DCEFE7; }
    .stat-label { display: flex; align-items: center; gap: 5px; color: var(--ice); font-size: 10.5px; font-weight: 700; white-space: nowrap; }
    .stat-tile.dark .stat-label { color: rgba(255,255,255,.55); }
    .stat-value { margin-top: 7px; font-size: 23px; line-height: 1; font-weight: 800; letter-spacing: -.04em; }
    .stat-value small { font-size: 10px; font-weight: 650; letter-spacing: 0; color: var(--ice); margin-left: 3px; }
    .stat-tile.dark .stat-value small { color: rgba(255,255,255,.54); }
    .stat-note { margin-top: 6px; color: var(--ice); font-size: 10px; }

    /* Progress elements */
    .progress-track { width: 100%; height: 7px; border-radius: 999px; background: #EDF1F4; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--rose), #D996AA); transition: width .7s var(--ease); }
    .progress-fill.dark { background: linear-gradient(90deg, var(--ink), #3B4D65); }
    .progress-fill.green { background: linear-gradient(90deg, var(--success), #85B8A4); }
    .ring {
      --p: 0; --size: 108px; --thick: 9px;
      width: var(--size); height: var(--size); border-radius: 50%; flex: none;
      display: grid; place-items: center; position: relative;
      background: conic-gradient(var(--rose) calc(var(--p) * 1%), #EDF1F4 0);
      transition: background .7s var(--ease);
    }
    .ring::before { content: ""; position: absolute; inset: var(--thick); background: #fff; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(231,235,240,.7); }
    .ring > div { position: relative; z-index: 1; text-align: center; line-height: 1.08; }
    .ring strong { display: block; font-size: 24px; font-weight: 850; letter-spacing: -.05em; }
    .ring span { display: block; color: var(--ice); font-size: 9.5px; margin-top: 4px; }
    .ring.green { background: conic-gradient(var(--success) calc(var(--p) * 1%), #EDF1F4 0); }
    .ring.dark { background: conic-gradient(var(--ink) calc(var(--p) * 1%), #EDF1F4 0); }
    .ring.rose-soft::before { background: var(--rose-mist); }
    .ring.green::before { background: var(--success-soft); }

    .macro-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .macro-mini { padding: 10px 9px; border-radius: 12px; background: #F8FAFB; min-width: 0; }
    .macro-mini .name { display: flex; align-items: center; gap: 5px; color: var(--ice); font-size: 9.5px; font-weight: 700; }
    .macro-mini strong { display: block; margin-top: 5px; font-size: 15px; letter-spacing: -.02em; }
    .macro-mini small { display: block; color: var(--ice); font-size: 9px; margin-top: 1px; }
    .macro-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
    .macro-dot.protein { background: var(--rose); }
    .macro-dot.carb { background: #6F8FAF; }
    .macro-dot.fat { background: #C79A5B; }

    /* Training preview */
    .session-badge { display: inline-flex; align-items: center; gap: 6px; color: var(--rose-deep); font-size: 10.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
    .session-badge .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--rose); box-shadow: 0 0 0 4px rgba(195,111,139,.12); }
    .session-title { margin: 9px 0 4px; font-size: 21px; }
    .session-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; color: var(--ice); font-size: 11px; }
    .session-meta svg { width: 13px; height: 13px; }
    .session-meta span { display: inline-flex; align-items: center; gap: 4px; }
    .mini-exercises { display: flex; gap: 7px; overflow-x: auto; padding: 3px 0 2px; scrollbar-width: none; }
    .mini-exercises::-webkit-scrollbar { display: none; }
    .mini-exercise {
      flex: none; min-width: 104px; max-width: 126px; padding: 10px; border: 1px solid #EFF2F5;
      border-radius: 13px; background: #FAFBFC; cursor: pointer; text-align: left; transition: all .18s var(--ease);
    }
    .mini-exercise:hover { border-color: #E3D3D8; background: var(--rose-mist); transform: translateY(-1px); }
    .mini-exercise strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; }
    .mini-exercise span { display: block; margin-top: 3px; color: var(--ice); font-size: 9.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .workout-actions { display: flex; gap: 8px; margin-top: 15px; }
    .workout-actions .btn { flex: 1; }
    .adjust-banner {
      display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px; border-radius: 12px;
      background: var(--gold-soft); border: 1px solid #F3E3C9; color: #77582E; font-size: 11px; line-height: 1.45;
    }
    .adjust-banner svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }

    /* Water */
    .water-card { overflow: hidden; }
    .water-figure { display: flex; align-items: center; gap: 15px; }
    .water-glass-art { width: 72px; flex: none; }
    .water-big { font-size: 31px; font-weight: 850; letter-spacing: -.06em; line-height: 1; }
    .water-big small { font-size: 11px; color: var(--ice); letter-spacing: 0; font-weight: 650; margin-left: 2px; }
    .water-grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; margin-top: 14px; }
    .water-cup {
      height: 38px; border: 1px dashed var(--ice-light); border-radius: 7px; background: #FBFCFD;
      display: grid; place-items: center; cursor: pointer; color: #D0D8E1; padding: 0;
      transition: all .2s var(--ease); position: relative; overflow: hidden;
    }
    .water-cup:hover { border-color: var(--rose); color: var(--rose); transform: translateY(-2px); }
    .water-cup.filled { border-style: solid; border-color: rgba(111,143,175,.28); background: #E9F2F7; color: #5C89A7; }
    .water-cup.filled::after { content: ""; position: absolute; inset: auto 0 0; height: 68%; background: linear-gradient(180deg, transparent, rgba(111,143,175,.16)); }
    .water-cup svg { width: 17px; height: 17px; position: relative; z-index: 1; }
    .water-note { margin-top: 10px; color: var(--ice); font-size: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }

    /* Achievements */
    .achievement-mini-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .achievement-mini { border: 1px solid #EFF2F5; border-radius: 13px; padding: 9px 5px 8px; text-align: center; background: #FBFCFD; cursor: pointer; transition: transform .18s var(--ease), border-color .18s var(--ease), background .18s var(--ease); }
    .achievement-mini:hover { transform: translateY(-2px); border-color: #E7D2D9; background: var(--rose-mist); }
    .achievement-mini .medal { width: 46px; margin: 0 auto 5px; }
    .achievement-mini span { display: block; font-size: 9px; color: var(--ice); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .achievement-mini.locked { filter: grayscale(.8); opacity: .55; }
    .medal { aspect-ratio: 1; }
    .medal svg { width: 100%; height: 100%; }
    .medal-pop { animation: medalPop .7s var(--ease) both; }
    @keyframes medalPop { 0% { transform: scale(.55) rotate(-14deg); } 55% { transform: scale(1.13) rotate(4deg); } 80% { transform: scale(.96) rotate(-1deg); } 100% { transform: scale(1) rotate(0); } }

    /* Training page */
    .stage-card {
      background:
        radial-gradient(circle at 90% 0%, rgba(195,111,139,.24), transparent 16rem),
        linear-gradient(120deg, var(--ink), #20334B);
      color: #fff; border: 0;
    }
    .stage-card .eyebrow { color: #E3A6B8; }
    .stage-card h1 { margin: 8px 0 4px; font-size: clamp(22px, 4vw, 31px); color: #fff; }
    .stage-card p { color: rgba(255,255,255,.62); margin: 0; font-size: 12px; }
    .stage-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
    .stage-progress { margin-top: 18px; }
    .stage-progress .progress-track { background: rgba(255,255,255,.12); }
    .stage-progress .progress-fill { background: linear-gradient(90deg, #E3A6B8, var(--rose)); }
    .stage-progress-labels { display: flex; justify-content: space-between; color: rgba(255,255,255,.5); font-size: 9.5px; margin-top: 7px; }
    .week-strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
    .day-cell {
      min-width: 0; padding: 9px 4px; border-radius: 12px; border: 1px solid transparent; background: #F8FAFB;

    .training-layout { display: grid; gap: 18px; }
    .flow-section { position: relative; }

    .flow-index { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; background: var(--ink); color: #fff; font-size: 10px; font-weight: 800; flex: none; }

    .rest-card { text-align: center; padding: 28px 18px; }

    .completed-panel { border: 1px solid #DCEFE7; background: var(--success-soft); border-radius: var(--radius-md); padding: 13px; }

    /* Diet */

    .date-switcher { display: inline-flex; align-items: center; gap: 5px; background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 4px; box-shadow: var(--shadow-sm); }
    .date-switcher .date-label { min-width: 96px; text-align: center; font-size: 11.5px; font-weight: 800; padding: 4px; }
    .diet-summary { overflow: hidden; }
    .diet-summary-main { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .diet-summary-copy { flex: 1; min-width: 140px; }
    .diet-summary-copy h2 { margin: 4px 0 5px; font-size: 20px; }
    .diet-summary-copy p { margin: 0; color: var(--ice); font-size: 11.5px; }
    .calorie-target-row { display: flex; align-items: baseline; gap: 5px; margin-top: 11px; }
    .calorie-target-row strong { font-size: 29px; line-height: 1; letter-spacing: -.05em; }
    .calorie-target-row span { color: var(--ice); font-size: 10.5px; }
    .gap-message { display: inline-flex; align-items: center; gap: 5px; margin-top: 9px; padding: 6px 9px; border-radius: 9px; font-size: 10.5px; font-weight: 700; }
    .gap-message.deficit { color: #8B6437; background: var(--gold-soft); }
    .gap-message.surplus { color: var(--rose-deep); background: var(--rose-soft); }
    .gap-message.goal { color: var(--success); background: var(--success-soft); }
    .macro-pie-wrap { position: relative; width: 150px; height: 150px; flex: none; }
    .macro-pie-wrap canvas { width: 100%; height: 100%; }
    .pie-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
    .pie-center strong { display: block; font-size: 19px; line-height: 1; letter-spacing: -.04em; }
    .pie-center span { color: var(--ice); font-size: 9px; }
    .macro-legend { display: grid; gap: 7px; margin-top: 12px; }
    .macro-legend-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 10.5px; }
    .macro-legend-row span:first-child { display: flex; align-items: center; gap: 5px; color: var(--ink-3); }
    .macro-legend-row strong { font-size: 11px; }
    .meal-grid { display: grid; gap: 12px; }
    .meal-card { border: 1px solid #ECF0F3; background: #fff; border-radius: 17px; overflow: hidden; }
    .meal-card-head { padding: 14px 15px 11px; background: linear-gradient(120deg, #FCF8F9, #FAFBFC); border-bottom: 1px solid #F1F3F5; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .meal-type { display: flex; align-items: center; gap: 7px; color: var(--rose-deep); font-size: 10px; font-weight: 800; letter-spacing: .08em; }
    .meal-card h3 { margin: 5px 0 0; font-size: 15px; }
    .meal-kcal { text-align: right; flex: none; }
    .meal-kcal strong { display: block; font-size: 18px; line-height: 1; letter-spacing: -.03em; }
    .meal-kcal span { color: var(--ice); font-size: 9px; }
    .meal-body { padding: 12px 15px 14px; }
    .ingredient-list { display: flex; flex-wrap: wrap; gap: 5px 7px; margin: 0 0 9px; padding: 0; list-style: none; }
    .ingredient-list li { color: var(--ink-3); font-size: 10px; background: #F7F9FA; padding: 3px 6px; border-radius: 6px; }
    .method { margin: 0 0 10px; color: #596575; font-size: 10.5px; line-height: 1.55; }
    .meal-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .meal-macros { color: var(--ice); font-size: 9.5px; }
    .meal-actions { display: flex; align-items: center; gap: 5px; }
    .meal-card.compact { padding: 13px; }
    .record-layout { display: grid; gap: 15px; }
    .record-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .record-tab { border: 1px solid var(--line); background: #fff; border-radius: 11px; padding: 8px 6px; font-size: 10px; font-weight: 700; cursor: pointer; color: var(--ice); transition: all .18s var(--ease); display: flex; align-items: center; justify-content: center; gap: 6px; }
    .record-tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
    .record-tab .count { font-size: 8px; background: rgba(154,164,176,.18); border-radius: 999px; padding: 1px 5px; }
    .record-tab.active .count { background: rgba(255,255,255,.16); }
    .record-list { display: grid; gap: 7px; }
    .record-group-title { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 1px; color: var(--ice); font-size: 9.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .record-item { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 12px; background: #FBFCFD; border: 1px solid #F0F2F5; }
    .record-icon { width: 32px; height: 32px; border-radius: 10px; background: var(--rose-soft); color: var(--rose-deep); display: grid; place-items: center; flex: none; font-size: 10px; font-weight: 800; }
    .record-icon.blue { background: #EDF3F8; color: #5C89A7; }
    .record-icon.gold { background: var(--gold-soft); color: #976E38; }
    .record-main { flex: 1; min-width: 0; }
    .record-main strong { display: block; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .record-main span { display: block; color: var(--ice); font-size: 9px; margin-top: 1px; }
    .record-nutrition { text-align: right; flex: none; }
    .record-nutrition strong { display: block; font-size: 11.5px; }
    .record-nutrition span { color: var(--ice); font-size: 8.5px; }
    .remove-btn { border: 0; background: transparent; color: #C5CDD6; cursor: pointer; padding: 4px; border-radius: 7px; }
    .remove-btn:hover { color: var(--danger); background: #FDF0F1; }
    .remove-btn svg { width: 14px; height: 14px; }
    .empty-state { text-align: center; padding: 24px 12px; color: var(--ice); }
    .empty-state .empty-art { width: 90px; margin: 0 auto 8px; opacity: .8; }
    .empty-state strong { display: block; color: var(--ink-3); font-size: 12px; }
    .empty-state p { margin: 4px auto 0; max-width: 280px; font-size: 10.5px; }
    .add-record-bar { margin-top: 2px; }
    .water-log-row { display: flex; align-items: center; justify-content: space-between; padding: 12px; border: 1px solid #E6EEF3; background: #F7FBFD; border-radius: 13px; }
    .water-log-row .water-count { font-size: 25px; font-weight: 850; letter-spacing: -.04em; }

    /* My */
    .profile-hero { display: flex; align-items: center; gap: 15px; color: #fff; background: linear-gradient(125deg, #111E30, #22354E); border: 0; overflow: hidden; }
    .profile-hero::after { content: ""; position: absolute; width: 170px; height: 170px; border-radius: 50%; background: rgba(195,111,139,.20); right: -60px; top: -80px; filter: blur(5px); }
    .profile-avatar { width: 72px; height: 72px; border-radius: 22px; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.12); display: grid; place-items: center; flex: none; overflow: hidden; }
    .profile-avatar svg { width: 68px; height: 68px; }
    .profile-hero h1 { margin: 3px 0 4px; font-size: 23px; color: #fff; }
    .profile-hero p { margin: 0; color: rgba(255,255,255,.58); font-size: 11px; }
    .profile-hero .profile-actions { margin-left: auto; display: flex; gap: 6px; position: relative; z-index: 1; }
    .profile-hero .icon-btn { background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.12); color: #fff; }
    .profile-hero .icon-btn:hover { background: rgba(255,255,255,.16); }
    .metric-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; }
    .metric-tile { background: #F8FAFB; border: 1px solid #EFF2F5; border-radius: 13px; padding: 12px; }
    .metric-tile span { color: var(--ice); font-size: 9.5px; }
    .metric-tile strong { display: block; font-size: 20px; letter-spacing: -.04em; margin-top: 4px; }
    .metric-tile small { display: block; color: var(--ice); font-size: 8.5px; margin-top: 2px; }
    .target-bars { display: grid; gap: 11px; }
    .target-bar-row .target-label { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 5px; font-size: 10px; }
    .target-label span { color: var(--ink-3); font-weight: 700; }
    .target-label strong { font-size: 10.5px; }
    .trend-controls { display: flex; gap: 6px; flex-wrap: wrap; }
    .chart-wrap { position: relative; height: 225px; margin-top: 10px; }
    .chart-wrap canvas { width: 100%; height: 100%; }
    .trend-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin-top: 8px; }
    .trend-summary > div { background: #F8FAFB; border-radius: 10px; padding: 9px; }
    .trend-summary span { display: block; color: var(--ice); font-size: 8.5px; }
    .trend-summary strong { display: block; margin-top: 2px; font-size: 14px; letter-spacing: -.02em; }
    .trend-summary strong.up { color: var(--rose-deep); }
    .trend-summary strong.down { color: var(--success); }
    .measurement-list { display: grid; gap: 6px; margin-top: 12px; max-height: 210px; overflow: auto; padding-right: 2px; }
    .measurement-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 9px; background: #FBFCFD; font-size: 10.5px; }
    .measurement-row span { color: var(--ice); }
    .achievement-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; }
    .achievement-card { position: relative; border: 1px solid #EFF2F5; border-radius: 15px; padding: 12px 10px; text-align: center; background: #FCFDFD; overflow: hidden; cursor: pointer; transition: all .2s var(--ease); }
    .achievement-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); border-color: #EAD8DE; }
    .achievement-card .medal { width: 67px; margin: 0 auto 7px; }
    .achievement-card strong { display: block; font-size: 11px; }
    .achievement-card p { margin: 3px 0 0; color: var(--ice); font-size: 8.5px; line-height: 1.35; }
    .achievement-card .status { display: inline-flex; margin-top: 6px; font-size: 8px; font-weight: 800; color: var(--success); }
    .achievement-card.locked { background: #FAFBFC; }
    .achievement-card.locked .medal { filter: grayscale(1); opacity: .45; }
    .achievement-card.locked strong { color: var(--ice); }
    .achievement-card .lock-tag { position: absolute; top: 8px; right: 8px; color: #BAC4CE; }
    .achievement-card .lock-tag svg { width: 12px; height: 12px; }
    .settings-list { display: grid; gap: 9px; }
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #F0F3F5; }
    .setting-row:last-child { border-bottom: 0; }
    .setting-row strong { display: block; font-size: 11.5px; }
    .setting-row span { display: block; color: var(--ice); font-size: 9.5px; margin-top: 2px; }
    .toggle { position: relative; display: inline-flex; width: 42px; height: 24px; flex: none; cursor: pointer; }
    .toggle input { appearance: none; width: 0; height: 0; position: absolute; opacity: 0; }
    .toggle span { position: absolute; inset: 0; background: #DCE2E8; border-radius: 999px; transition: background .2s var(--ease); }
    .toggle span::after { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; box-shadow: 0 1px 4px rgba(17,30,48,.18); transition: transform .2s var(--ease); }
    .toggle input:checked + span { background: var(--rose); }
    .toggle input:checked + span::after { transform: translateX(18px); }
    .reminder-time { width: 78px; min-height: 34px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 9px; background: #fff; font-size: 11px; color: var(--ink); }
    .settings-note { margin: 10px 0 0; padding: 9px 10px; border-radius: 9px; background: #F7F9FA; color: var(--ice); font-size: 9.5px; line-height: 1.45; }
    .danger-zone { display: flex; flex-wrap: wrap; gap: 7px; }

    /* Forms */
    .field { display: grid; gap: 6px; min-width: 0; }
    .field > label, .field-label { font-size: 10.5px; font-weight: 800; color: var(--ink-3); }
    .field .help { color: var(--ice); font-size: 9.5px; }
    .input, .select, .textarea {
      width: 100%; min-height: 43px; border: 1px solid var(--line); border-radius: 12px;
      background: #fff; color: var(--ink); padding: 10px 12px; font-size: 13px; outline: 0;
      transition: border-color .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease);
    }
    .input::placeholder, .textarea::placeholder { color: #B7C0CA; }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--rose); box-shadow: 0 0 0 4px rgba(195,111,139,.10); }
    .input[readonly] { background: #F7F9FA; color: var(--ice); }
    .textarea { min-height: 84px; resize: vertical; }
    .input-wrap { position: relative; }
    .input-wrap .input { padding-right: 48px; }
    .input-suffix { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--ice); font-size: 10px; pointer-events: none; }
    .form-grid { display: grid; gap: 13px; }
    .form-grid.two { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .form-error { color: var(--danger); background: #FCEEF0; border: 1px solid #F4D7DA; border-radius: 9px; padding: 8px 10px; font-size: 10.5px; display: none; }
    .form-error.show { display: block; animation: shake .35s var(--ease); }
    @keyframes shake { 25% { transform: translateX(-4px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }
    .segmented { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 6px; padding: 4px; background: #F4F6F8; border-radius: 13px; }
    .segmented.three { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .segmented.four { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .segmented button { border: 0; background: transparent; border-radius: 10px; min-height: 36px; color: var(--ice); font-size: 11px; font-weight: 700; cursor: pointer; transition: all .18s var(--ease); }
    .segmented button.active { color: var(--ink); background: #fff; box-shadow: 0 2px 8px rgba(17,30,48,.08); }
    .choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
    .choice-card { border: 1px solid var(--line); border-radius: 13px; background: #fff; padding: 11px; text-align: left; cursor: pointer; transition: all .18s var(--ease); position: relative; }
    .choice-card:hover { border-color: #E5D3D9; background: #FDFAFB; transform: translateY(-1px); }
    .choice-card.active { border-color: var(--rose); background: var(--rose-mist); box-shadow: 0 0 0 3px rgba(195,111,139,.09); }
    .choice-card strong { display: block; font-size: 11.5px; }
    .choice-card span { display: block; color: var(--ice); font-size: 9px; line-height: 1.4; margin-top: 3px; }
    .choice-card .choice-icon { font-size: 17px; line-height: 1; margin-bottom: 7px; display: block; color: var(--rose-deep); }
    .choice-card.active::after { content: "✓"; position: absolute; right: 8px; top: 8px; width: 16px; height: 16px; display: grid; place-items: center; border-radius: 50%; background: var(--rose); color: #fff; font-size: 9px; }
    .validation-hint { color: var(--ice); font-size: 9.5px; }

    /* Modal */
    .modal-root { position: fixed; inset: 0; z-index: 100; display: none; }
    .modal-root.open { display: block; }
    .modal-backdrop { position: absolute; inset: 0; background: rgba(9,17,28,.48); backdrop-filter: blur(3px); animation: fadeIn .22s ease both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-panel {
      position: absolute; z-index: 1; left: 50%; bottom: 0; transform: translateX(-50%);
      width: min(640px, 100%); max-height: min(88vh, 900px); overflow: auto; overscroll-behavior: contain;
      background: #F8F9FA; border-radius: 26px 26px 0 0; box-shadow: var(--shadow-lg);
      animation: sheetIn .32s var(--ease) both; scrollbar-width: thin;
    }
    @keyframes sheetIn { from { opacity: 0; transform: translate(-50%, 38px); } to { opacity: 1; transform: translate(-50%, 0); } }
    .modal-panel.wide { width: min(840px, 100%); }
    .modal-header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 12px; background: rgba(248,249,250,.94); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(231,235,240,.8); }
    .modal-header h2 { margin: 0; font-size: 17px; }
    .modal-header p { margin: 3px 0 0; color: var(--ice); font-size: 10px; }
    .modal-body { padding: 16px 18px calc(24px + var(--safe-bottom)); }
    .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .modal-footer .btn { flex: 1; }
    .modal-section + .modal-section { margin-top: 14px; }
    .modal-card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 15px; }
    .modal-tip { padding: 10px 11px; border-radius: 10px; background: var(--rose-mist); color: var(--rose-deep); font-size: 10.5px; line-height: 1.5; }

    /* Add food */
    .food-search-row { display: flex; gap: 7px; }
    .food-search-row .input { flex: 1; }
    .food-result-list { display: grid; gap: 6px; max-height: 280px; overflow: auto; padding-right: 2px; }
    .food-result { display: flex; align-items: center; gap: 8px; width: 100%; border: 1px solid #EFF2F5; background: #fff; border-radius: 11px; padding: 9px 10px; text-align: left; cursor: pointer; transition: all .16s var(--ease); }
    .food-result:hover { border-color: #E8D6DC; background: var(--rose-mist); }
    .food-result.selected { border-color: var(--rose); background: var(--rose-mist); }
    .food-result-main { flex: 1; min-width: 0; }
    .food-result-main strong { display: block; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .food-result-main span { display: block; color: var(--ice); font-size: 9px; margin-top: 1px; }
    .food-result-macros { color: var(--ice); font-size: 9px; text-align: right; flex: none; }
    .food-result-macros strong { display: block; color: var(--ink); font-size: 11px; }
    .food-result-macros span { display: block; }
    .food-detail { margin-top: 12px; padding: 13px; background: #fff; border: 1px solid var(--line); border-radius: 14px; }
    .food-detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .food-detail-head h3 { margin: 0; font-size: 14px; }
    .food-detail-head p { margin: 3px 0 0; color: var(--ice); font-size: 9.5px; }
    .serving-tabs { display: flex; gap: 5px; align-items: center; }
    .serving-tab { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 5px 8px; font-size: 9.5px; cursor: pointer; color: var(--ice); }
    .serving-tab.active { color: #fff; background: var(--ink); border-color: var(--ink); }
    .quantity-row { display: flex; gap: 7px; align-items: flex-end; margin-top: 11px; }
    .quantity-row .field { flex: 1; }
    .quantity-row .btn { min-height: 41px; }
    .quick-amounts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .quick-amounts button { border: 1px solid var(--line); background: #FBFCFD; border-radius: 7px; padding: 4px 7px; font-size: 9px; color: var(--ice); cursor: pointer; }
    .quick-amounts button:hover { color: var(--rose-deep); border-color: #E7D4DA; background: var(--rose-mist); }
    .nutrition-preview { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 5px; margin-top: 10px; }
    .nutrition-preview > div { background: #F7F9FA; border-radius: 8px; padding: 7px 5px; text-align: center; }
    .nutrition-preview strong { display: block; font-size: 11.5px; }
    .nutrition-preview span { display: block; color: var(--ice); font-size: 8px; margin-top: 1px; }
    .meal-type-tabs { display: flex; gap: 5px; overflow: auto; padding-bottom: 2px; }
    .meal-type-tab { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 5px 9px; font-size: 9.5px; cursor: pointer; color: var(--ice); white-space: nowrap; }
    .meal-type-tab.active { background: var(--rose-soft); color: var(--rose-deep); border-color: #F0D8DF; }

    /* Checkin */
    .checkin-ex { padding: 10px 0; border-bottom: 1px solid #F0F3F5; }
    .checkin-ex:last-child { border-bottom: 0; padding-bottom: 0; }
    .checkin-ex-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
    .checkin-ex-head strong { font-size: 11px; }
    .checkin-ex-head span { color: var(--ice); font-size: 9px; }
    .checkin-inputs { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
    .checkin-inputs .field { gap: 3px; }
    .checkin-inputs label { color: var(--ice); font-size: 8.5px; font-weight: 650; }
    .checkin-inputs .input { min-height: 34px; padding: 6px 8px; font-size: 11px; border-radius: 8px; }
    .checkin-inputs .cardio-only { grid-column: span 3; }
    .exercise-detail-art { width: min(280px, 78%); margin: 6px auto 15px; border-radius: 20px; overflow: hidden; background: #F8F4F5; }
    .exercise-detail-art svg { width: 100%; height: auto; }
    .detail-section { margin-top: 13px; }
    .detail-section h3 { margin: 0 0 7px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
    .detail-section h3::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--rose); }
    .detail-list { margin: 0; padding-left: 17px; color: #536070; font-size: 11px; line-height: 1.7; }
    .detail-warning { background: #FFF8EE; border: 1px solid #F6E5C9; border-radius: 12px; padding: 11px; color: #7D5C31; font-size: 10.5px; line-height: 1.55; }
    .detail-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 9px 0 2px; }

    /* Library */
    .library-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
    .library-item { border: 1px solid #EFF2F5; background: #fff; border-radius: 13px; padding: 7px; text-align: left; cursor: pointer; transition: all .18s var(--ease); display: flex; align-items: center; gap: 8px; min-width: 0; }
    .library-item:hover { transform: translateY(-1px); border-color: #E8D6DC; background: var(--rose-mist); }
    .library-item .exercise-art { width: 50px; height: 48px; border-radius: 9px; }
    .library-item div { min-width: 0; }
    .library-item strong { display: block; font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .library-item span { display: block; color: var(--ice); font-size: 8px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Onboarding */
    .onboarding { position: fixed; inset: 0; z-index: 200; overflow: auto; background: var(--bg); }
    .onboarding-shell { min-height: 100%; display: grid; grid-template-columns: 1fr; }
    .ob-side { display: none; position: relative; overflow: hidden; background: var(--ink); color: #fff; padding: 42px; }
    .ob-side::before { content: ""; position: absolute; width: 380px; height: 380px; border-radius: 50%; background: rgba(195,111,139,.20); right: -160px; top: -100px; filter: blur(2px); }
    .ob-side::after { content: ""; position: absolute; width: 260px; height: 260px; border-radius: 50%; border: 1px solid rgba(255,255,255,.10); left: -120px; bottom: -80px; box-shadow: 0 0 0 45px rgba(255,255,255,.025); }
    .ob-side-inner { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }
    .ob-logo { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 800; letter-spacing: -.02em; }
    .ob-logo .brand-mark { background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.12); }
    .ob-side h1 { margin: auto 0 14px; color: #fff; font-size: clamp(30px, 3.2vw, 47px); letter-spacing: -.055em; max-width: 400px; }
    .ob-side h1 em { color: #E3A6B8; font-style: normal; }
    .ob-side p { color: rgba(255,255,255,.58); max-width: 390px; font-size: 13px; line-height: 1.75; }
    .ob-side-points { display: grid; gap: 11px; margin: 24px 0 32px; }
    .ob-side-point { display: flex; align-items: flex-start; gap: 10px; color: rgba(255,255,255,.75); font-size: 11px; }
    .ob-side-point .point-icon { width: 25px; height: 25px; flex: none; border-radius: 8px; background: rgba(255,255,255,.09); color: #E3A6B8; display: grid; place-items: center; }
    .ob-side-point .point-icon svg { width: 14px; height: 14px; }
    .ob-mascot { width: 180px; align-self: flex-end; margin-top: -10px; opacity: .96; filter: drop-shadow(0 20px 30px rgba(0,0,0,.18)); }
    .ob-panel { background: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    .ob-top { padding: 22px 20px 0; }
    .ob-mobile-brand { display: flex; align-items: center; gap: 8px; margin-bottom: 22px; }
    .ob-mobile-brand .brand-mark { background: var(--ink); color: #fff; }
    .ob-progress { display: flex; gap: 6px; margin-top: 2px; }
    .ob-progress span { height: 4px; border-radius: 999px; background: #EDF0F3; flex: 1; overflow: hidden; position: relative; }
    .ob-progress span.done::after, .ob-progress span.active::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--rose); transform-origin: left; animation: fillBar .5s var(--ease) both; }
    .ob-progress span.active::after { background: linear-gradient(90deg, var(--ink), var(--rose)); }
    @keyframes fillBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .ob-step-meta { display: flex; justify-content: space-between; color: var(--ice); font-size: 10px; margin-top: 8px; }
    .ob-content { flex: 1; padding: 23px 20px 20px; max-width: 620px; width: 100%; margin: 0 auto; }
    .ob-content h2 { margin: 29px 0 5px; font-size: clamp(25px, 5vw, 32px); letter-spacing: -.045em; }
    .ob-content .ob-sub { color: var(--ice); font-size: 12px; margin-bottom: 22px; }
    .ob-footer { padding: 14px 20px calc(18px + var(--safe-bottom)); border-top: 1px solid var(--line); background: rgba(255,255,255,.94); }
    .ob-footer-inner { max-width: 620px; margin: 0 auto; display: flex; gap: 8px; }
    .ob-footer .btn { flex: 1; }
    .ob-footer .btn-back { flex: 0 0 90px; }
    .ob-summary { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 7px; margin-top: 16px; }
    .ob-summary > div { padding: 10px 7px; border-radius: 10px; background: #F8FAFB; text-align: center; border: 1px solid #EFF2F5; }
    .ob-summary strong { display: block; font-size: 17px; letter-spacing: -.03em; }
    .ob-summary span { display: block; color: var(--ice); font-size: 8px; margin-top: 2px; }
    .ob-tip { display: flex; align-items: flex-start; gap: 7px; margin-top: 16px; color: var(--ice); font-size: 9.5px; line-height: 1.5; }
    .ob-tip svg { width: 14px; height: 14px; flex: none; margin-top: 1px; }
    .ob-days { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .ob-day { width: 42px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ice); cursor: pointer; font-size: 10.5px; font-weight: 700; }
    .ob-day.active { background: var(--ink); color: #fff; border-color: var(--ink); }

    /* Toasts & celebration */
    .toast-stack { position: fixed; z-index: 300; left: 50%; bottom: calc(84px + var(--safe-bottom)); transform: translateX(-50%); width: min(420px, calc(100% - 28px)); display: grid; gap: 7px; pointer-events: none; }
    .toast { pointer-events: auto; display: flex; align-items: center; gap: 9px; padding: 11px 12px; background: var(--ink); color: #fff; border-radius: 13px; box-shadow: var(--shadow-lg); font-size: 11px; animation: toastIn .3s var(--ease) both; }
    .toast.out { animation: toastOut .25s ease both; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: none; } }
    @keyframes toastOut { to { opacity: 0; transform: translateY(8px) scale(.98); } }
    .toast .toast-icon { width: 24px; height: 24px; border-radius: 8px; background: rgba(255,255,255,.10); display: grid; place-items: center; flex: none; color: #E3A6B8; }
    .toast .toast-icon svg { width: 14px; height: 14px; }
    .toast .toast-message { flex: 1; line-height: 1.4; }
    .toast .toast-action { border: 0; background: rgba(255,255,255,.10); color: #fff; border-radius: 7px; padding: 5px 7px; font-size: 9.5px; font-weight: 800; cursor: pointer; }
    .celebration { position: fixed; inset: 0; z-index: 400; display: grid; place-items: center; background: rgba(17,30,48,.58); backdrop-filter: blur(6px); animation: fadeIn .25s ease both; padding: 24px; }
    .celebration-card { position: relative; width: min(390px, 100%); background: #fff; border-radius: 28px; padding: 28px 22px 22px; text-align: center; box-shadow: var(--shadow-lg); overflow: hidden; animation: medalPop .55s var(--ease) both; }
    .celebration-card::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 15%, rgba(195,111,139,.20), transparent 43%); pointer-events: none; }
    .celebration-card .medal { width: 125px; margin: 0 auto 10px; position: relative; z-index: 1; animation: float 2s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-7px) rotate(2deg); } }
    .celebration-card .eyebrow { position: relative; z-index: 1; }
    .celebration-card h2 { margin: 7px 0 5px; font-size: 25px; position: relative; z-index: 1; }
    .celebration-card p { color: var(--ice); font-size: 11px; margin: 0 auto 16px; max-width: 260px; position: relative; z-index: 1; }
    .confetti { position: absolute; width: 7px; height: 12px; border-radius: 2px; top: -20px; animation: confettiFall 2.8s linear infinite; }
    @keyframes confettiFall { to { transform: translateY(680px) rotate(540deg); opacity: .1; } }

    /* Bottom navigation */
    .bottom-nav {
      position: fixed; z-index: 50; left: 50%; bottom: 0; transform: translateX(-50%);
      width: min(560px, 100%); display: grid; grid-template-columns: repeat(4, 1fr);
      padding: 7px 12px calc(7px + var(--safe-bottom)); background: rgba(255,255,255,.94);
      border-top: 1px solid rgba(231,235,240,.9); backdrop-filter: blur(18px);
      border-radius: 20px 20px 0 0; box-shadow: 0 -8px 30px rgba(17,30,48,.06);
    }
    .nav-tab { border: 0; background: transparent; color: var(--ice); cursor: pointer; padding: 5px 2px 3px; display: grid; justify-items: center; gap: 2px; border-radius: 11px; transition: color .18s var(--ease), transform .18s var(--ease); }
    .nav-tab:hover { color: var(--ink-3); }
    .nav-tab:active { transform: scale(.96); }
    .nav-tab svg { width: 20px; height: 20px; }
    .nav-tab span { font-size: 9px; font-weight: 750; }
    .nav-tab.active { color: var(--rose-deep); }
    .nav-tab.active svg { filter: drop-shadow(0 4px 6px rgba(195,111,139,.22)); }

    /* desktop and tablet */
    @media (min-width: 760px) {
      .shell { width: min(1200px, 100% - 56px); }
      .page { padding-top: 30px; }
      .topbar-inner { min-height: 78px; }
      .hero { padding: 34px 38px; }
      .hero-mascot { width: 150px; }
      .card { padding: 22px; }
      .meal-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .meal-card { display: flex; flex-direction: column; }
      .meal-body { display: flex; flex-direction: column; flex: 1; }
      .meal-foot { margin-top: auto; }
      .record-layout { grid-template-columns: minmax(0, 1.25fr) minmax(250px, .75fr); }
      .achievement-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .library-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .modal-panel { top: 50%; bottom: auto; transform: translate(-50%, -50%); border-radius: 26px; animation: modalIn .28s var(--ease) both; }
      @keyframes modalIn { from { opacity: 0; transform: translate(-50%, -46%) scale(.97); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
      .modal-body { padding: 18px 22px 22px; }
      .modal-header { padding: 18px 22px 13px; }
      .toast-stack { bottom: 24px; }
      .water-grid { gap: 7px; }
    }

    @media (min-width: 960px) {
      .desktop-nav { display: flex; }
      .bottom-nav { display: none; }
      .page { padding-bottom: 65px; }
      .dashboard-grid { grid-template-columns: minmax(0, 1.55fr) minmax(310px, .85fr); align-items: start; }
      .main-stack, .side-stack { display: grid; gap: 18px; }
      .training-layout { grid-template-columns: minmax(0, 1.5fr) minmax(300px, .8fr); align-items: start; }
      .diet-summary-main { flex-wrap: nowrap; }
      .diet-layout { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(310px, .7fr); gap: 18px; align-items: start; }
      .my-layout { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(320px, .8fr); gap: 18px; align-items: start; }
      .achievement-grid { grid-template-columns: repeat(4, minmax(0,1fr)); }
      .hero-mascot { width: 170px; margin-right: 20px; }
      .onboarding-shell { grid-template-columns: minmax(370px, .82fr) minmax(500px, 1.18fr); }
      .ob-side { display: block; }
      .ob-panel { min-height: 100vh; }
      .ob-top { padding: 34px 48px 0; }
      .ob-mobile-brand { display: none; }
      .ob-content { padding: 26px 48px 24px; max-width: 650px; }
      .ob-footer { padding: 17px 48px 21px; }
      .ob-footer-inner { max-width: 650px; margin-left: 0; }
    }

    @media (max-width: 420px) {
      .shell { width: calc(100% - 24px); }
      .topbar-inner { min-height: 62px; }
      .brand-copy span { display: none; }
      .hero { padding: 22px 18px; }
      .hero-mascot { width: 82px; }
      .hero h1 { font-size: 25px; }
      .hero-sub { font-size: 11.5px; }
      .card { padding: 16px; border-radius: 19px; }
      .stats-grid { gap: 7px; }
      .stat-tile { padding: 11px; }
      .stat-value { font-size: 20px; }
      .water-grid { gap: 3px; }
      .water-cup { height: 34px; border-radius: 6px; }
      .achievement-mini-grid { gap: 5px; }
      .achievement-mini { padding: 7px 3px; }
      .achievement-mini .medal { width: 38px; }
      .exercise-card { grid-template-columns: 60px minmax(0,1fr) auto; gap: 8px; }
      .exercise-art { width: 60px; height: 57px; }
      .diet-summary-main { gap: 12px; }
      .macro-pie-wrap { width: 125px; height: 125px; }
      .trend-summary { gap: 5px; }
      .record-tab span:not(.count) { display: none; }
      .form-grid.two { grid-template-columns: 1fr; }
      .choice-grid { grid-template-columns: 1fr; }
      .achievement-grid { gap: 7px; }
      .achievement-card { padding: 10px 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="app" id="app" hidden>
    <header class="topbar">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.1"/><path d="M5.5 19.2c.8-3.3 3.2-5 6.5-5s5.7 1.7 6.5 5" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    </header>
    <main class="shell" id="mainContent">
      <section class="page" id="page-today" data-page="today" aria-label="今日概览"></section>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5 12 4l7.5 6.5v8.2c0 .8-.6 1.3-1.3 1.3H5.8c-.8 0-1.3-.6-1.3-1.3v-8.2Z"/><path d="M9.2 20v-5.6h5.6V20"/></svg>
        <span>今日</span>
      </button>
      <button class="nav-tab" data-action="switch-tab" data-tab="training" aria-label="训练">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8.2v7.6M8.2 6.5v11M15.8 6.5v11M19 8.2v7.6M8.2 12h7.6M2.8 10.2v3.6M21.2 10.2v3.6"/></svg>
        <span>训练</span>
      </button>
      <button class="nav-tab" data-action="switch-tab" data-tab="diet" aria-label="饮食">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M6.1 3.5v7.1M8.8 3.5v7.1M4.2 3.5v4c0 2 1 3.1 2.3 3.1h.1M6.6 10.6v9.9M17.8 3.5c-1.5 1.1-2.4 3.1-2.4 5.6 0 2.6 1 4.2 2.4 4.2V3.5ZM17.8 13.3v7.2"/></svg>

  <div id="onboardingRoot"></div>
  <div class="modal-root" id="modalRoot" aria-hidden="true"></div>

  <div id="celebrationRoot"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script>
    'use strict';
    // Application source lives below. All data is embedded for offline use.
    const APP_VERSION = 1;
    const STORAGE_KEY = 'pawfit.state.v1';
    const UI_KEY = 'pawfit.ui.v1';

    const GOALS = [
