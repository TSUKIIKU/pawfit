    document.addEventListener('click', event => {
      const trigger = event.target.closest('[data-action]');
      if (!trigger) return;
      const action = trigger.dataset.action;
      switch (action) {
        case 'switch-tab':
          switchTab(trigger.dataset.tab);
          break;
        case 'open-my':
          switchTab('my');
          break;
        case 'close-modal':
          closeModal();
          break;
        case 'close-celebration':
          closeCelebration();
          break;
        case 'open-checkin': {
          const date = trigger.dataset.date || (ui.tab === 'training' ? ui.trainingDate : todayKey());
          openCheckin(date);
          break;
        }
        case 'open-add-food': {
          const date = trigger.closest('#page-today') ? todayKey() : ui.dietDate;
          openAddFood(trigger.dataset.meal || 'breakfast', date);
          break;
        }
        case 'exercise-detail':
          openExerciseDetail(trigger.dataset.id);
          break;
        case 'open-library':
          openLibrary();
          break;
        case 'library-type':
          ui.libraryFilter = trigger.dataset.value;
          openLibrary();
          break;
        case 'library-mode':
          ui.libraryMode = trigger.dataset.value;
          openLibrary();
          break;
        case 'open-achievement':
          openAchievementDetail(trigger.dataset.id);
          break;
        case 'edit-profile':
          openEditProfile();
          break;
        case 'save-profile':
          saveProfileFromModal();
          break;
        case 'add-measurement':
          openMeasurement(trigger.dataset.date || todayKey());
          break;
        case 'save-measurement':
          saveMeasurement();
          break;
        case 'fill-checkin':
          document.querySelectorAll('[data-checkin-row]').forEach(row => {
            const type = row.dataset.type;
            if (type === 'strength' || type === 'timed') {
              const setsInput = row.querySelector('[data-k="sets"]');
              if (setsInput) setsInput.value = row.dataset.plannedSets;
              if (type === 'timed') {
                const secondsInput = row.querySelector('[data-k="seconds"]');
                if (secondsInput) secondsInput.value = row.dataset.plannedSeconds;
              } else {
                const repsInput = row.querySelector('[data-k="reps"]');
                if (repsInput) repsInput.value = row.dataset.plannedReps;
              }
            } else {
              const minutesInput = row.querySelector('[data-k="minutes"]');
              if (minutesInput) minutesInput.value = row.dataset.plannedMinutes;
            }
          });
          showToast('已按计划填满，请按实际完成情况修改。', { icon: 'check' });
          break;
        case 'save-checkin':
          saveCheckin();
          break;
        case 'food-select': {
          const food = findFood(trigger.dataset.id);
          if (food && foodModal) {
            foodModal.selectedId = food.id;
            foodModal.grams = food.serving || 100;
            renderAddFoodModal();
          }
          break;
        }
        case 'food-unit':
          if (foodModal) { foodModal.unit = trigger.dataset.unit; renderAddFoodModal(); }
          break;
        case 'food-quick-amount':
          if (foodModal) {
            const food = findFood(foodModal.selectedId);
            if (food) {
              const grams = numberOr(trigger.dataset.value, 100);
              const input = document.getElementById('foodAmountInput');
              if (input) input.value = round(foodModal.unit === 'portion' ? grams / food.serving : grams, 1);
              updateFoodAmount(input?.value);
            }
          }
          break;
        case 'food-category':
          if (foodModal) { foodModal.category = trigger.dataset.value; renderAddFoodModal(); }
          break;
        case 'food-meal-type':
          if (foodModal) { foodModal.mealType = trigger.dataset.value; renderAddFoodModal(); }
          break;
        case 'add-selected-food':
          addSelectedFood();
          break;
        case 'open-custom-food':
          openCustomFood();
          break;
        case 'back-to-food':
          if (foodModal) renderAddFoodModal(); else closeModal();
          break;
        case 'save-custom-food':
          saveCustomFood();
          break;
        case 'water-modal-quick': {
          const input = document.getElementById('waterAmountInput');
          if (input) input.value = trigger.dataset.value;
          break;
        }
        case 'add-water-modal':
          beginAddWaterFromModal();
          break;
        case 'water-cup': {
          const date = waterDateFrom(trigger);
          const index = numberOr(trigger.dataset.index, 0);
          const cup = numberOr(trigger.dataset.amount, 250) || 250;
          const current = getWater(date);
          const next = current >= (index + 1) * cup ? index * cup : (index + 1) * cup;
          setWaterAmount(date, next);
          break;
        }
        case 'add-water': {
          const date = waterDateFrom(trigger);
          const metrics = calculateMetrics(state.profile);
          const cup = Math.max(200, Math.round(metrics.waterTarget / 8 / 50) * 50);
          setWaterAmount(date, getWater(date) + cup);
          break;
        }
        case 'remove-water': {
          const date = waterDateFrom(trigger);
          const metrics = calculateMetrics(state.profile);
          const cup = Math.max(200, Math.round(metrics.waterTarget / 8 / 50) * 50);
          setWaterAmount(date, Math.max(0, getWater(date) - cup));
          break;
        }
        case 'diet-date-prev':
          ui.dietDate = addDays(ui.dietDate, -1);
          ui.recordFilter = 'all';
          renderApp();
          break;
        case 'diet-date-next': {
          const next = addDays(ui.dietDate, 1);
          if (next > todayKey()) showToast('不能查看未来日期的饮食记录。', { icon: 'info' });
          else { ui.dietDate = next; ui.recordFilter = 'all'; renderApp(); }
          break;
        }
        case 'diet-today':
          ui.dietDate = todayKey();
          ui.recordFilter = 'all';
          renderApp();
          break;
        case 'select-training-date':
          ui.trainingDate = trigger.dataset.date;
          renderApp();
          break;
        case 'training-week-prev':
          ui.trainingDate = addDays(ui.trainingDate, -7);
          renderApp();
          break;
        case 'training-week-next':
          ui.trainingDate = addDays(ui.trainingDate, 7);
          renderApp();
          break;
        case 'training-today':
          ui.trainingDate = todayKey();
          renderApp();
          break;
        case 'vary-meals':
          state.recipeOffset[ui.dietDate] = numberOr(state.recipeOffset[ui.dietDate], 0) + 1;
          saveState();
          renderApp();
          showToast('已换一组三餐搭配，目标热量保持不变。', { icon: 'refresh' });
          break;
        case 'log-recipe': {
          const meal = getRecommendedMeals(ui.dietDate).find(item => item.mealType === trigger.dataset.mealType);
          if (!meal) break;
          const grams = meal.ingredients.reduce((sum, item) => sum + item.grams, 0);
          getDayLog(ui.dietDate).entries.push({
            id: uid('entry'), date: ui.dietDate, mealType: meal.mealType, foodId: null,
            name: meal.name, grams: round(grams, 1), kcal: meal.kcal, protein: meal.protein,
            carbs: meal.carbs, fat: meal.fat, source: 'recipe', createdAt: new Date().toISOString()
          });
          saveState();
          const newAchievements = evaluateAchievements();
          renderApp();
          showToast(`${meal.name} 已记入${MEAL_TYPES[meal.mealType].label}。`, { icon: 'meal' });
          if (newAchievements.length) celebrateAchievements(newAchievements);
          break;
        }
        case 'record-filter':
          ui.recordFilter = trigger.dataset.filter || 'all';
          renderApp();
          break;
        case 'remove-entry': {
          const date = ui.dietDate;
          const entries = getDayLog(date).entries;
          const index = entries.findIndex(entry => entry.id === trigger.dataset.id);
          if (index === -1) break;
          const [removed] = entries.splice(index, 1);
          saveState();
          renderApp();
          showToast(`${removed.name} 已从记录中删除。`, {
            icon: 'trash', actionLabel: '撤销',
            onAction: () => {
              const current = getDayLog(date).entries;
              current.splice(clamp(index, 0, current.length), 0, removed);
              saveState();
              renderApp();
            }
          });
          break;
        }
        case 'trend-metric':
          ui.trendMetric = trigger.dataset.metric;
          renderApp();
          break;
        case 'trend-period':
          ui.trendPeriod = numberOr(trigger.dataset.period, 30);
          renderApp();
          break;
        case 'save-reminders':
          saveRemindersSettings();
          break;
        case 'reset-plan':
          if (window.confirm('确定从今天重新开始 4 周训练阶段吗？历史训练与饮食记录不会删除。')) {
            state.planStart = todayKey();
            ui.trainingDate = todayKey();
            saveState();
            renderApp();
            showToast('训练阶段已重置，从今天重新开始。', { icon: 'refresh' });
          }
          break;
        case 'export-data':
          exportData();
          break;
        case 'import-data':
          document.getElementById('importFile').click();
          break;
        case 'reset-all':
          if (window.confirm('确定清空所有本地数据吗？食物自定义、训练、饮食、身体记录与勋章都会被删除，此操作无法撤销。')) {
            localStorage.removeItem(STORAGE_KEY);
            state = clone(DEFAULT_STATE);
            onboarding = { step: 1, gender: 'female', age: 28, height: 165, weight: 60, bodyfat: '', activity: 'light', goal: '塑形', scene: 'home', days: 4 };
            closeModal();
            closeCelebration();
            document.getElementById('toastRoot').innerHTML = '';
            ui = { tab: 'today', trainingDate: todayKey(), dietDate: todayKey(), trendMetric: 'weight', trendPeriod: 30, recordFilter: 'all', libraryFilter: 'all', libraryMode: 'all', foodCategory: '全部' };
            renderApp();
          }
          break;
        case 'onboarding-next':
          if (!validateOnboarding(onboarding.step)) break;
          onboarding.step = Math.min(3, onboarding.step + 1);
          renderOnboarding();
          document.querySelector('.onboarding')?.scrollTo({ top: 0, behavior: 'smooth' });
          break;
        case 'onboarding-back':
          onboarding.step = Math.max(1, onboarding.step - 1);
          renderOnboarding();
          document.querySelector('.onboarding')?.scrollTo({ top: 0, behavior: 'smooth' });
          break;
        case 'onboarding-choice':
          onboarding[trigger.dataset.field] = trigger.dataset.value;
          renderOnboarding();
          break;
        case 'onboarding-days':
          onboarding.days = numberOr(trigger.dataset.value, 4);
          renderOnboarding();
          break;
        case 'finish-onboarding':
          finishOnboarding();
          break;
        default:
          break;
      }
    });

    document.addEventListener('input', event => {
      const target = event.target;
      if (target.matches('[data-ob-field]')) {
        onboarding[target.dataset.obField] = target.value;
      }
      if (target.matches('[data-input="food-search"]') && foodModal) {
        foodModal.query = target.value;
        refreshFoodResults();
      }
      if (target.matches('[data-input="food-amount"]') && foodModal) {
        updateFoodAmount(target.value);
      }
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        if (document.querySelector('.celebration')) { closeCelebration(); return; }
        if (document.getElementById('modalRoot').classList.contains('open')) closeModal();
      }
      if (event.key === 'Tab') {
        const panel = document.querySelector('.modal-panel');
        if (!panel || !document.getElementById('modalRoot').classList.contains('open')) return;
        const focusables = [...panel.querySelectorAll('button:not(:disabled), input:not(:disabled), select:not(:disabled), textarea:not(:disabled), [href]')].filter(el => el.offsetParent !== null);
        if (!focusables.length) return;
        const first = focusables[0];
        const last = focusables[focusables.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
    });

    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => renderCharts(), 120);
    });

    document.getElementById('importFile').addEventListener('change', importDataFile);

    function initApp() {
      if (state.profile) {
        state.planStart = state.planStart || todayKey();
        evaluateAchievements();
        saveState();
        renderApp();
        initReminderTimer();
      } else {
        renderOnboarding();
      }
    }

    initApp();
  </script>
</body>
</html>
